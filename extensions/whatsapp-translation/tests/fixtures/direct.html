<main id="main" data-id="true_desktop-chat@c.us_message">
  <div class="message-in">
    <div class="media-panel">
      <div class="copyable-text"><span class="selectable-text">Media caption</span></div>
    </div>
  </div>
  <div class="message-system"><span>System notice</span></div>
  <div class="message-in">
    <div class="copyable-text"><span class="selectable-text">Can you ship this week?</span></div>
  </div>
  <div class="message-in">
    <div class="copyable-text"><span class="selectable-text"></span></div>
  </div>
  <div class="message-in message-revoked">
    <div class="copyable-text"><span class="selectable-text">Removed notice</span></div>
  </div>
  <div class="message-out">
    <div class="copyable-text"><span class="selectable-text">Already sent</span></div>
  </div>
  <footer>
    <div contenteditable="true" data-tab="10">Current draft</div>
  </footer>
</main>
