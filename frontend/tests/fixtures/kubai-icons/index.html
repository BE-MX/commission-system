<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kubai icon gallery</title>
<style>
  body { margin: 0; font-family: var(--font-display); background: var(--content-bg, #f5f3ef); }
  .stage { display: flex; gap: 24px; padding: 24px; align-items: flex-start; }
  .sidebar { list-style: none; margin: 0; padding: 8px; width: 240px; border-radius: 12px; background: linear-gradient(180deg, var(--sidebar-glass-from), var(--sidebar-glass-to)); }
  .sidebar .el-menu-item { height: 42px; border-radius: 10px; color: rgba(255, 255, 255, 0.55); font-size: 13px; display: flex; align-items: center; padding: 0 20px; cursor: pointer; }
  .sidebar .el-menu-item:hover { background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.92); }
  .sidebar .el-menu-item.is-active { color: var(--card-bg); background: linear-gradient(135deg, var(--color-gold), var(--color-primary)); }
  .sidebar .el-menu-item.is-active .nav-icon { width: 28px; height: 28px; margin-left: -2px; margin-right: 6px; border-radius: 7px; background: rgba(255, 255, 255, 0.92); box-shadow: 0 1px 3px rgba(74, 46, 6, 0.3); }
  .el-icon.nav-icon { font-size: 24px; width: 24px; margin-right: 8px; }
  .light { display: flex; flex-direction: column; gap: 24px; }
  .grid { display: grid; grid-template-columns: repeat(7, 96px); gap: 8px; }
  .tile { height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 12px; background: var(--card-bg, #fff); cursor: pointer; }
  .tile .big { font-size: 40px; }
  .account { width: 180px; background: #fff; border-radius: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1); padding: 6px 0; }
  .el-icon.account-icon { font-size: 20px; }
</style>
</head>
<body><div id="app"></div><script type="module" src="./main.js"></script></body>
</html>
