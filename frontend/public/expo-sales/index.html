<title>leShine Hair · 广州展会样品销售</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#1D1A13; --muted:#8D8474;
    --line:#EAE2D0; --brand:#FDD958; --brand-soft:#FDF0BC; --brand-deep:#E3B700;
    --danger:#B3402E; --ok:#4C7A4C; --chip:#F3EDDE;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    font-size:15px; line-height:1.45;
    padding-bottom:140px;
  }
  .num{font-variant-numeric:tabular-nums;}

  /* ===== Header ===== */
  header{
    position:sticky; top:0; z-index:20;
    background:var(--brand); color:var(--ink);
    padding:10px 16px;
    box-shadow:0 2px 10px rgba(60,45,0,.14);
  }
  header .brand{max-width:760px; margin:0 auto; display:flex; align-items:center; gap:12px;}
  header .logo{height:40px; width:auto; display:block;}
  header h1{margin:0; font-size:16px; font-weight:700; letter-spacing:.5px;}

  main{max-width:760px; margin:0 auto; padding:12px 12px 0;}
  section{display:none;}
  section.active{display:block;}

  /* ===== Filters ===== */
  .filters{position:sticky; top:60px; z-index:15; background:var(--bg); padding:6px 0 8px;}
  .search{
    width:100%; border:1px solid var(--line); border-radius:12px;
    background:var(--card); padding:11px 14px; font-size:15px; color:var(--ink);
    outline:none;
  }
  .search:focus{border-color:var(--brand-deep); box-shadow:0 0 0 3px rgba(253,217,88,.35);}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:9px 2px 2px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; border:1px solid var(--line); background:var(--chip);
    color:#6B5F52; border-radius:999px; padding:6px 14px; font-size:13.5px; cursor:pointer;
  }
  .chip.on{background:var(--ink); color:var(--brand); border-color:var(--ink); font-weight:600;}

  /* ===== Item cards ===== */
  .list{display:flex; flex-direction:column; gap:10px; margin-top:8px;}
  .item{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; display:flex; align-items:center; gap:12px;
  }
  .item.soldout{opacity:.55;}
  .item .info{flex:1; min-width:0;}
  .item .name{font-size:15.5px; font-weight:600; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .grade{font-size:11px; font-weight:700; background:var(--brand-soft); color:#7A6410;
    border-radius:6px; padding:1px 7px;}
  .item .desc{font-size:13px; color:var(--muted); margin-top:3px;}
  .item .price{margin-top:5px; font-size:15px; font-weight:800; color:var(--ink);}
  .item .price small{font-size:12px; font-weight:400; color:var(--muted); margin-left:6px;}
  .stock-tag{font-size:12px; margin-top:3px; color:var(--ok);}
  .stock-tag.low{color:var(--danger); font-weight:600;}
  .stock-tag.out{color:var(--danger); font-weight:600;}
  .item .act{flex:0 0 auto; display:flex; align-items:center;}

  .btn-add{
    width:38px; height:38px; border-radius:50%; border:none;
    background:var(--ink); color:var(--brand); font-size:22px; line-height:1; cursor:pointer;
  }
  .btn-add:disabled{background:#C9C0B4; color:#F3EDDE; cursor:not-allowed;}
  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{
    width:32px; height:32px; border-radius:50%; border:1px solid var(--line);
    background:var(--chip); color:var(--ink); font-size:18px; cursor:pointer;
  }
  .stepper button:disabled{opacity:.4; cursor:not-allowed;}
  .stepper .q{width:48px; text-align:center; font-weight:700; font-size:15px; font-family:inherit;
    border:1px solid var(--line); border-radius:8px; padding:5px 2px; background:var(--card); color:var(--ink); outline:none;}
  .stepper .q:focus{border-color:var(--brand-deep); box-shadow:0 0 0 3px rgba(253,217,88,.35);}
  .stepper .q::-webkit-outer-spin-button,.stepper .q::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .stepper .q{-moz-appearance:textfield; appearance:textfield;}

  .empty{padding:44px 0; text-align:center; color:var(--muted); font-size:14px;}

  /* ===== Cart bar ===== */
  #cartBar{
    position:fixed; left:0; right:0; bottom:64px; z-index:25;
    display:none; padding:10px 14px;
  }
  #cartBar.show{display:block;}
  #cartBar .inner{
    max-width:732px; margin:0 auto; background:var(--ink); color:#F5EFE6;
    border-radius:14px; padding:12px 16px; display:flex; align-items:center; gap:10px;
    box-shadow:0 6px 20px rgba(0,0,0,.25); cursor:pointer;
  }
  #cartBar .lbl{flex:1; font-size:14.5px;}
  #cartBar .amt{font-size:17px; font-weight:800; color:var(--brand);}
  #cartBar .go{font-size:13.5px; font-weight:600; background:var(--brand); color:var(--ink); border-radius:8px; padding:6px 12px;}

  /* ===== Bottom nav ===== */
  nav{
    position:fixed; left:0; right:0; bottom:0; z-index:30; height:64px;
    background:var(--card); border-top:1px solid var(--line);
    display:flex; padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1; border:none; background:none; font-size:13px; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    cursor:pointer; position:relative;
  }
  nav button svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  nav button.on svg{stroke-width:2;}
  #cartBar svg{width:19px; height:19px; flex:0 0 auto; fill:none; stroke:var(--brand); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  nav button.on{color:var(--ink); font-weight:700; box-shadow:inset 0 3px 0 var(--brand);}
  .badge{
    position:absolute; top:6px; left:calc(50% + 4px); min-width:18px; height:18px;
    border-radius:9px; background:var(--danger); color:#fff; font-size:11px;
    display:flex; align-items:center; justify-content:center; padding:0 5px;
  }

  /* ===== Sheet (cart / success) ===== */
  #overlay{
    position:fixed; inset:0; background:rgba(30,24,18,.45); z-index:40;
    display:none;
  }
  #overlay.show{display:block;}
  #sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    background:var(--bg); border-radius:18px 18px 0 0;
    max-height:86vh; display:none; flex-direction:column;
    transform:translateY(100%); transition:transform .22s ease-out;
  }
  #sheet.show{display:flex; transform:translateY(0);}
  #sheet .wrap{max-width:760px; width:100%; margin:0 auto; display:flex; flex-direction:column; max-height:86vh;}
  #sheet .head{
    padding:14px 16px 10px; display:flex; align-items:center;
    border-bottom:1px solid var(--line);
  }
  #sheet .head h2{margin:0; font-size:16.5px; flex:1;}
  #sheet .close{border:none; background:none; font-size:22px; color:var(--muted); cursor:pointer; padding:2px 6px;}
  #sheet .body{overflow-y:auto; padding:12px 16px; flex:1;}
  #sheet .foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--card);}

  .cust-input{
    width:100%; border:1px solid var(--line); border-radius:12px; background:var(--card);
    padding:11px 14px; font-size:15px; outline:none; margin-bottom:12px;
  }
  .cust-input:focus{border-color:var(--brand-deep); box-shadow:0 0 0 3px rgba(253,217,88,.35);}

  .cline{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; display:flex; align-items:center; gap:10px; margin-bottom:8px;
  }
  .cline .ci{flex:1; min-width:0;}
  .cline .cn{font-size:14px; font-weight:600;}
  .cline .cd{font-size:12px; color:var(--muted); margin-top:2px;}
  .cline .ca{font-size:14px; font-weight:800; color:var(--ink); white-space:nowrap;}

  .total-row{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;}
  .total-row .t{font-size:14px; color:var(--muted);}
  .total-row .v{font-size:22px; font-weight:800;}
  .btn-primary{
    width:100%; border:none; border-radius:12px; background:var(--ink);
    color:var(--brand); font-size:16px; font-weight:700; padding:13px; cursor:pointer;
  }
  .btn-primary:disabled{background:#C9C0B4; color:#F3EDDE; cursor:not-allowed;}
  .btn-ghost{
    width:100%; border:1px solid var(--line); border-radius:12px; background:var(--card);
    color:var(--ink); font-size:15px; padding:12px; cursor:pointer; margin-top:8px;
  }

  /* success */
  .succ{text-align:center; padding:18px 0 6px;}
  .succ .tick{
    width:58px; height:58px; border-radius:50%; background:var(--ink); color:var(--brand);
    font-size:30px; display:flex; align-items:center; justify-content:center; margin:0 auto 12px;
  }
  .succ h3{margin:0 0 4px; font-size:18px;}
  .succ .ono{color:var(--muted); font-size:13.5px; margin-bottom:14px;}
  .succ .sum{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; text-align:left; font-size:14px; margin-bottom:14px;
  }
  .succ .sum .r{display:flex; justify-content:space-between; padding:3px 0;}
  .succ .sum .r.total{border-top:1px dashed var(--line); margin-top:6px; padding-top:8px; font-weight:700;}

  /* ===== Orders tab ===== */
  .ocard{background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden;}
  .ocard .top{padding:12px 14px; cursor:pointer; display:flex; align-items:center; gap:10px;}
  .ocard .oi{flex:1; min-width:0;}
  .ocard .ono{font-size:14.5px; font-weight:700;}
  .ocard .om{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .ocard .ot{text-align:right;}
  .ocard .ot .a{font-size:16px; font-weight:800; color:var(--ink);}
  .ocard .st{font-size:11.5px; border-radius:6px; padding:1px 8px; margin-top:3px; display:inline-block;}
  .ocard .st.done{background:var(--brand-soft); color:#7A6410; font-weight:600;}
  .ocard .st.cancelled{background:#F3E3DF; color:var(--danger);}
  .ocard .lines{display:none; border-top:1px dashed var(--line); padding:10px 14px; font-size:13.5px;}
  .ocard.open .lines{display:block;}
  .ocard .lines .lr{display:flex; justify-content:space-between; gap:8px; padding:3px 0;}
  .ocard .lines .lr .lq{color:var(--muted); white-space:nowrap;}
  .ocard .cancel{
    margin-top:8px; border:1px solid var(--danger); background:none; color:var(--danger);
    border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer;
  }
  .admin{margin-top:18px; display:flex; gap:8px; flex-wrap:wrap;}
  .admin button{
    flex:1; min-width:100px; border:1px solid var(--line); background:var(--card);
    border-radius:10px; padding:10px 6px; font-size:13px; color:#6B5F52; cursor:pointer;
  }
  .note{margin-top:14px; font-size:12px; color:var(--muted); text-align:center; line-height:1.6;}

  /* toast */
  #toast{
    position:fixed; left:50%; bottom:150px; transform:translateX(-50%) translateY(20px);
    background:rgba(29,26,19,.94); color:var(--brand); font-size:14px;
    padding:10px 18px; border-radius:10px; z-index:60; opacity:0;
    transition:opacity .2s, transform .2s; pointer-events:none; max-width:80vw; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>

{id:57,p:"接发环",g:"",s:"",z:"",c:"",n:1,pr:10.00,per:1,cat:"配件"},
];
/* 分类严格按照清单中的产品类型与命名 */
const CATS = ["全部", ...new Set(ITEMS.map(it=>it.p))];

/* ================= 状态 ================= */
const LS_KEY = "gzExpo.v1";
let state = { stock:{}, cart:{}, orders:[], seq:1 };

function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}
const STOCK_VER = 2;  /* 库存数据版本：初始库存调整时 +1，各设备打开时自动重新播种 */
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const s = JSON.parse(raw); if(s && s.stock) state = s; }
  }catch(e){}
  if(state.stockVer !== STOCK_VER){ state.stock = {}; state.stockVer = STOCK_VER; }
  ITEMS.forEach(it=>{ if(typeof state.stock[it.id] !== "number") state.stock[it.id] = it.n; });
  if(!state.cart) state.cart = {};
  if(!state.orders) state.orders = [];
  if(!state.seq) state.seq = 1;
}

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const byId = id => ITEMS.find(x=>x.id===id);
const packCents = it => Math.round(it.pr*it.per*100);
const money = cents => "$" + (cents/100).toFixed(2);
const esc = s => String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function fmtTime(iso){
  const d = new Date(iso);
  const p = n => String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
let toastTimer = null;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 1800);
}

function itemDesc(it){
  const parts = [it.s, it.z?it.z+'"':"", it.c].filter(Boolean);
  return parts.join(" · ");
}
function matchItem(it, q){
  if(!q) return true;
  const hay = (it.p+" "+it.g+" "+it.s+" "+it.z+" "+it.c).toLowerCase();
  return q.toLowerCase().split(/\s+/).every(tok => hay.includes(tok));
}

/* ================= 过滤 ================= */
const filter = { q:"", cat:"全部" };
function renderChips(){
  ["#chips1","#chips2"].forEach(sel=>{
    $(sel).innerHTML = CATS.map(c=>
      `<button class="chip${filter.cat===c?" on":""}" data-cat="${c}">${c}</button>`).join("");
  });
}
function visibleItems(){
  return ITEMS.filter(it => (filter.cat==="全部"||it.p===filter.cat) && matchItem(it, filter.q));
}

/* ================= 库存查询 ================= */
function stockTagHtml(it){
  const s = state.stock[it.id];
  if(s<=0) return `<div class="stock-tag out">已售罄</div>`;
  if(s<=2) return `<div class="stock-tag low">仅剩 ${s} 包</div>`;
  return `<div class="stock-tag">库存 ${s} 包</div>`;
}
function renderStock(){
  const list = visibleItems();
  if(!list.length){ $("#stockList").innerHTML = `<div class="empty">没有匹配的样品</div>`; return; }
  $("#stockList").innerHTML = list.map(it=>{
    const soldout = state.stock[it.id]<=0;
    return `<div class="item${soldout?" soldout":""}">
      <div class="info">
        <div class="name">${esc(it.p)}${it.g?` <span class="grade">${esc(it.g)}</span>`:""}</div>
        <div class="desc">${esc(itemDesc(it))||"&nbsp;"}</div>
        <div class="price num">${money(packCents(it))}<small>/包</small><small>　${money(Math.round(it.pr*100))}/${esc(it.s?it.s.replace(/.*\//,""):"件")} × ${it.per}</small></div>
        ${stockTagHtml(it)}
      </div>
    </div>`;
  }).join("");
}

/* ================= 下单 ================= */
function renderOrder(){
  const list = visibleItems();
  if(!list.length){ $("#orderList").innerHTML = `<div class="empty">没有匹配的样品</div>`; return; }
  $("#orderList").innerHTML = list.map(it=>{
    const s = state.stock[it.id], q = state.cart[it.id]||0;
    const soldout = s<=0;
    let act;
    if(q>0){
      act = `<div class="stepper">
        <button data-dec="${it.id}">−</button>
        <input class="q num" type="number" min="0" max="${s}" step="1" inputmode="numeric" data-qty="${it.id}" value="${q}">
        <button data-inc="${it.id}" ${q>=s?"disabled":""}>＋</button>
      </div>`;
    }else{
      act = `<button class="btn-add" data-inc="${it.id}" ${soldout?"disabled":""}>＋</button>`;
    }
    return `<div class="item${soldout?" soldout":""}">
      <div class="info">
        <div class="name">${esc(it.p)}${it.g?` <span class="grade">${esc(it.g)}</span>`:""}</div>
        <div class="desc">${esc(itemDesc(it))||"&nbsp;"}</div>
        <div class="price num">${money(packCents(it))}<small>/包</small></div>
        ${stockTagHtml(it)}
      </div>
      <div class="act">${act}</div>
    </div>`;
  }).join("");
}

function cartInfo(){
  let packs=0, cents=0, lines=0;
  for(const id in state.cart){
    const q = state.cart[id]; if(!q) continue;
    const it = byId(+id); if(!it) continue;
    packs += q; cents += packCents(it)*q; lines++;
  }
  return {packs, cents, lines};
}
function renderCartBar(){
  const {packs, cents} = cartInfo();
  const onOrderTab = $("#tab-order").classList.contains("active");
  $("#cartBar").classList.toggle("show", onOrderTab && packs>0);
  $("#cartBarLbl").textContent = `已选 ${packs} 包`;
  $("#cartBarAmt").textContent = money(cents);
  const badge = $("#cartBadge");
  badge.style.display = packs>0 ? "flex" : "none";
  badge.textContent = packs;
}

/* ================= 购物车面板 ================= */
function openSheet(){ $("#overlay").classList.add("show"); $("#sheet").classList.add("show"); }
function closeSheet(){ $("#overlay").classList.remove("show"); $("#sheet").classList.remove("show"); }

function renderCartSheet(){
  const entries = Object.keys(state.cart).map(id=>({it:byId(+id), q:state.cart[id]})).filter(e=>e.it && e.q>0);
  const {packs, cents} = cartInfo();
  $("#sheetWrap").innerHTML = `
    <div class="head"><h2>确认订单</h2><button class="close" id="sheetClose">✕</button></div>
    <div class="body">
      <input class="cust-input" id="custName" placeholder="客户名称（必填）" maxlength="40" value="${esc(state._cust||"")}">
      ${entries.map(e=>`
        <div class="cline">
          <div class="ci">
            <div class="cn">${esc(e.it.p)}${e.it.g?` <span class="grade">${esc(e.it.g)}</span>`:""}</div>
            <div class="cd">${esc(itemDesc(e.it))} · ${money(packCents(e.it))}/包</div>
          </div>
          <div class="stepper">
            <button data-dec="${e.it.id}">−</button>
            <input class="q num" type="number" min="0" max="${state.stock[e.it.id]}" step="1" inputmode="numeric" data-qty="${e.it.id}" value="${e.q}">
            <button data-inc="${e.it.id}" ${e.q>=state.stock[e.it.id]?"disabled":""}>＋</button>
          </div>
          <div class="ca num" data-amt="${e.it.id}">${money(packCents(e.it)*e.q)}</div>
        </div>`).join("")}
      ${entries.length? "" : `<div class="empty">购物车是空的</div>`}
    </div>
    <div class="foot">
      <div class="total-row"><span class="t" id="sheetPacks">共 ${packs} 包</span><span class="v num" id="sheetTotal">${money(cents)}</span></div>
      <button class="btn-primary" id="btnSubmit" ${entries.length?"":"disabled"}>提交订单 · 扣减库存</button>
    </div>`;
  $("#sheetClose").onclick = closeSheet;
  $("#custName").oninput = ev => { state._cust = ev.target.value; };
  $("#btnSubmit").onclick = submitOrder;
}

function submitOrder(){
  const cust = (state._cust||"").trim();
  if(!cust){ toast("请先填写客户名称"); $("#custName").focus(); return; }
  const entries = Object.keys(state.cart).map(id=>({it:byId(+id), q:state.cart[id]})).filter(e=>e.it && e.q>0);
  if(!entries.length){ toast("购物车是空的"); return; }
  for(const e of entries){
    if(e.q > state.stock[e.it.id]){ toast(`「${e.it.p}」库存不足`); return; }
  }
  const btn = $("#btnSubmit"); btn.disabled = true;
  const lines = entries.map(e=>{
    state.stock[e.it.id] -= e.q;
    return { id:e.it.id, p:e.it.p, g:e.it.g, s:e.it.s, z:e.it.z, c:e.it.c,
             per:e.it.per, qty:e.q, packCents:packCents(e.it) };
  });
  const total = lines.reduce((a,l)=>a+l.packCents*l.qty, 0);
  const no = "GZ" + String(state.seq).padStart(4,"0");
  state.seq++;
  state.orders.push({ no, time:new Date().toISOString(), cust, lines, total, status:"done" });
  state.cart = {}; state._cust = "";
  save(); renderAll();
  renderSuccess(state.orders[state.orders.length-1]);
}

function renderSuccess(o){
  $("#sheetWrap").innerHTML = `
    <div class="head"><h2>下单成功</h2><button class="close" id="sheetClose">✕</button></div>
    <div class="body">
      <div class="succ">
        <div class="tick">✓</div>
        <h3>${esc(o.cust)}</h3>
        <div class="ono">订单号 ${o.no} · ${fmtTime(o.time)}</div>
        <div class="sum">
          ${o.lines.map(l=>`<div class="r"><span>${esc(l.p)}${l.g?" "+esc(l.g):""} <span style="color:var(--muted)">× ${l.qty}包</span></span><span class="num">${money(l.packCents*l.qty)}</span></div>`).join("")}
          <div class="r total"><span>合计</span><span class="num">${money(o.total)}</span></div>
        </div>
      </div>
    </div>
    <div class="foot">
      <button class="btn-primary" id="btnContinue">继续下单</button>
      <button class="btn-ghost" id="btnViewOrders">查看订单记录</button>
    </div>`;
  $("#sheetClose").onclick = closeSheet;
  $("#btnContinue").onclick = closeSheet;
  $("#btnViewOrders").onclick = ()=>{ closeSheet(); switchTab("orders"); };
}

/* ================= 订单记录 ================= */
function renderOrders(){
  const box = $("#ordersList");
  if(!state.orders.length){
    box.innerHTML = `<div class="empty">还没有订单</div>`;
    return;
  }
  box.innerHTML = [...state.orders].reverse().map(o=>{
    const packs = o.lines.reduce((a,l)=>a+l.qty,0);
    return `<div class="ocard" data-no="${o.no}">
      <div class="top" data-toggle="${o.no}">
        <div class="oi">
          <div class="ono">${o.no} · ${esc(o.cust)}</div>
          <div class="om">${fmtTime(o.time)} · ${o.lines.length} 款 / ${packs} 包</div>
        </div>
        <div class="ot">
          <div class="a num">${money(o.total)}</div>
          <span class="st ${o.status}">${o.status==="done"?"已成交":"已撤销"}</span>
        </div>
      </div>
      <div class="lines">
        ${o.lines.map(l=>`<div class="lr"><span>${esc(l.p)}${l.g?" "+esc(l.g):""} · ${esc([l.s,l.z?l.z+'"':"",l.c].filter(Boolean).join(" · "))}</span><span class="lq num">× ${l.qty}包　${money(l.packCents*l.qty)}</span></div>`).join("")}
        ${o.status==="done"?`<button class="cancel" data-cancel="${o.no}">撤销订单（恢复库存）</button>`:""}
      </div>
    </div>`;
  }).join("");
}

function cancelOrder(no){
  const o = state.orders.find(x=>x.no===no);
  if(!o || o.status!=="done") return;
  if(!confirm(`确定撤销订单 ${no}（${o.cust}）？\n库存将恢复。`)) return;
  o.lines.forEach(l=>{ if(byId(l.id)) state.stock[l.id] += l.qty; });
  o.status = "cancelled";
  save(); renderAll();
  toast(`订单 ${no} 已撤销，库存已恢复`);
}

function exportCSV(){
  if(!state.orders.length){ toast("还没有订单可导出"); return; }
  const head = ["订单号","时间","客户","状态","产品","等级","规格","尺寸(英寸)","颜色","每包件数","数量(包)","包价($)","行小计($)","订单总额($)"];
  const rows = [head];
  state.orders.forEach(o=>{
    o.lines.forEach(l=>{
      rows.push([o.no, fmtTime(o.time), o.cust, o.status==="done"?"已成交":"已撤销",
        l.p, l.g||"", l.s||"", l.z||"", l.c||"", l.per, l.qty,
        (l.packCents/100).toFixed(2), (l.packCents*l.qty/100).toFixed(2), (o.total/100).toFixed(2)]);
    });
  });
  const csv = "﻿" + rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  const d = new Date(), p = n=>String(n).padStart(2,"0");
  a.href = URL.createObjectURL(blob);
  a.download = `展会订单-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}

/* ================= 渲染 / 事件 ================= */
function renderAll(){
  renderChips(); renderStock(); renderOrder(); renderOrders(); renderCartBar();
}

function switchTab(name){
  ["stock","order","orders"].forEach(t=>{
    $("#tab-"+t).classList.toggle("active", t===name);
  });
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===name));
  renderCartBar();
  window.scrollTo(0,0);
}

function changeQty(id, delta){
  const it = byId(id); if(!it) return;
  const cur = state.cart[id]||0;
  const next = cur + delta;
  if(delta>0){
    if(state.stock[id]<=0){ toast("该样品已售罄"); return; }
    if(next > state.stock[id]){ toast(`最多 ${state.stock[id]} 包`); return; }
  }
  if(next<=0) delete state.cart[id]; else state.cart[id]=next;
  save(); renderStock(); renderOrder(); renderCartBar();
  if($("#sheet").classList.contains("show") && $("#btnSubmit")) renderCartSheet();
}

/* 直接输入数量：非法输入回退，超库存钳制，0/负数移除 */
function setQty(id, val, inputEl){
  const it = byId(id); if(!it) return;
  const stock = state.stock[id];
  let q = parseInt(val, 10);
  if(isNaN(q) || q < 0) q = state.cart[id]||0;
  if(q > stock){ q = stock; toast(`最多 ${stock} 包`); }
  if(q <= 0) delete state.cart[id]; else state.cart[id] = q;
  save(); renderStock(); renderOrder(); renderCartBar();
  if($("#sheet").classList.contains("show") && $("#btnSubmit")){
    if(inputEl && state.cart[id]){
      /* 购物车内输入：原地更新金额，不重绘面板（避免打断后续点击提交） */
      inputEl.value = state.cart[id];
      refreshSheetAmounts();
    }else{
      renderCartSheet();
    }
  }
}
function refreshSheetAmounts(){
  const {packs, cents} = cartInfo();
  const t = $("#sheetPacks"); if(!t) return;
  t.textContent = `共 ${packs} 包`;
  $("#sheetTotal").textContent = money(cents);
  document.querySelectorAll("#sheetWrap [data-amt]").forEach(el=>{
    const it = byId(+el.dataset.amt); if(!it) return;
    el.textContent = money(packCents(it)*(state.cart[it.id]||0));
  });
  document.querySelectorAll("#sheetWrap [data-inc]").forEach(el=>{
    el.disabled = (state.cart[+el.dataset.inc]||0) >= state.stock[+el.dataset.inc];
  });
}

document.addEventListener("click", ev=>{
  const t = ev.target;
  const inc = t.closest("[data-inc]"), dec = t.closest("[data-dec]");
  if(inc){ changeQty(+inc.dataset.inc, 1); return; }
  if(dec){ changeQty(+dec.dataset.dec, -1); return; }
  const chip = t.closest(".chip");
  if(chip){ filter.cat = chip.dataset.cat; renderChips(); renderStock(); renderOrder(); return; }
  const navBtn = t.closest("nav button");
  if(navBtn){ switchTab(navBtn.dataset.tab); return; }
  const toggle = t.closest("[data-toggle]");
  if(toggle){ toggle.closest(".ocard").classList.toggle("open"); return; }
  const cancel = t.closest("[data-cancel]");
  if(cancel){ cancelOrder(cancel.dataset.cancel); return; }
});

$("#q1").addEventListener("input", ev=>{ filter.q = ev.target.value; $("#q2").value = filter.q; renderStock(); renderOrder(); });
$("#q2").addEventListener("input", ev=>{ filter.q = ev.target.value; $("#q1").value = filter.q; renderStock(); renderOrder(); });
document.addEventListener("change", ev=>{
  const el = ev.target.closest ? ev.target.closest("[data-qty]") : null;
  if(el) setQty(+el.dataset.qty, el.value, el);
});
document.addEventListener("keydown", ev=>{
  if(ev.key === "Enter" && ev.target.matches && ev.target.matches("[data-qty]")) ev.target.blur();
});
$("#cartBarInner").addEventListener("click", ()=>{ renderCartSheet(); openSheet(); });
$("#overlay").addEventListener("click", closeSheet);
$("#btnExport").addEventListener("click", exportCSV);
$("#btnResetStock").addEventListener("click", ()=>{
  if(!confirm("将所有样品库存恢复为初始数量？")) return;
  if(!confirm("确认重置？此操作不会影响已保存的订单记录。")) return;
  ITEMS.forEach(it=> state.stock[it.id]=it.n);
  state.cart = {};
  save(); renderAll(); toast("库存已重置");
});
$("#btnClearOrders").addEventListener("click", ()=>{
  if(!state.orders.length){ toast("没有订单记录"); return; }
  if(!confirm("确定清空全部订单记录？此操作不可恢复！")) return;
  state.orders = []; state.seq = 1;
  save(); renderAll(); toast("订单记录已清空");
});

/* ================= 启动 ================= */
load();
renderAll();
</script>
</body>
</html>
