<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>莱莎采购节 · 团队积分榜</title>
<!-- 预取轮播下一屏资源，减轻 30s 硬跳转白闪 -->
<link rel="prefetch" href="zhaiyao.html">
<style>
  /* 设计系统同前两屏；七块玻璃面板与 1/2/3 徽章已烘焙在 bg-teams.jpg，
     排名即位置：上排左→右 = 第 1~4 名，下排 = 第 5~7 名 */
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#eef0f6; overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif; }
  body { animation:pageIn .28s ease-out; }
  @keyframes pageIn { from { opacity:0; } }
  :root{
    --pri:#4f7cff; --vio:#8b5cf6; --ink:#1d2545; --sub:#5d6b8f;
    --ease-out:cubic-bezier(.23,1,.32,1); --ease-in-out:cubic-bezier(.77,0,.175,1);
  }
  .num { font-variant-numeric:tabular-nums; }
  #stage { position:absolute; left:50%; top:50%; width:1920px; height:1080px;
    transform:translate(-50%,-50%) scale(1); transform-origin:center center;
    color:var(--ink); overflow:hidden;
    background:linear-gradient(180deg,#f0f2f8,#e8eaf4); }
  #stage::before { content:""; position:absolute; left:0; right:0; top:84px; bottom:0;
    background:url(assets/bg-teams.jpg) center top / cover no-repeat; }

  /* ── 背景光影流动层（同个人榜：斜向高光带 + 琉璃柔光斑呼吸） ── */
  .fx { position:absolute; left:0; right:0; top:84px; bottom:0;
    pointer-events:none; overflow:hidden; }
  .fx i { position:absolute; display:block; }
  .fx .sweep { top:-25%; bottom:-25%; left:-45%; width:42%;
    background:linear-gradient(105deg, transparent,
      rgba(255,255,255,.5) 42%, rgba(214,222,255,.28) 55%, rgba(255,255,255,.12) 66%, transparent);
    transform:rotate(14deg);
    animation:fxSweep 14s ease-in-out infinite; }
  @keyframes fxSweep {
    0%   { transform:translateX(0) rotate(14deg); }
    60%  { transform:translateX(530%) rotate(14deg); }
    100% { transform:translateX(530%) rotate(14deg); } }
  .fx .orb { width:560px; height:560px; border-radius:50%; }
  .fx .o1 { left:-150px; top:6%;
    background:radial-gradient(circle, rgba(118,110,240,.42), rgba(118,110,240,.16) 45%, transparent 68%);
    animation:fxDrift1 18s ease-in-out infinite alternate, fxBreath 7s ease-in-out infinite; }
  .fx .o2 { right:-170px; bottom:-12%;
    background:radial-gradient(circle, rgba(255,122,196,.34), rgba(255,122,196,.12) 45%, transparent 68%);
    animation:fxDrift2 22s ease-in-out infinite alternate, fxBreath 9s ease-in-out infinite; }
  .fx .o3 { left:38%; top:52%; width:700px; height:700px;
    background:radial-gradient(circle, rgba(56,182,220,.3), rgba(56,182,220,.1) 45%, transparent 68%);
    animation:fxDrift3 26s ease-in-out infinite alternate, fxBreath 11s ease-in-out infinite; }
  @keyframes fxDrift1 { to { transform:translate(190px, 100px); } }
  @keyframes fxDrift2 { to { transform:translate(-170px, -120px); } }
  @keyframes fxDrift3 { to { transform:translate(-210px, 70px); } }
  @keyframes fxBreath { 0%,100% { opacity:.4; } 50% { opacity:.9; } }

  /* ============ 频道顶栏（同款） ============ */
  header.ch { position:absolute; left:0; right:0; top:0; height:84px; z-index:30;
    display:flex; align-items:center; gap:22px; padding:0 30px;
    background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.22));
    backdrop-filter:blur(24px) saturate(1.6); -webkit-backdrop-filter:blur(24px) saturate(1.6);
    border-bottom:1px solid rgba(255,255,255,.75);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 0 rgba(255,255,255,.35), 0 8px 28px rgba(74,96,180,.12); }
  .live { position:relative; display:flex; align-items:center; gap:8px; color:#fff; font-weight:800;
    font-size:15px; letter-spacing:2px; padding:8px 18px 8px 14px; border-radius:10px;
    background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.08) 45%, rgba(255,255,255,0) 62%),
      linear-gradient(92deg,#ff7a5c,#ff5c72);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.85), inset 0 -5px 10px rgba(230,50,60,.35),
      0 0 0 1px rgba(255,255,255,.4), 4px 4px 0 rgba(180,40,60,.28), 0 6px 18px rgba(255,108,92,.5); }
  .live::after { content:""; position:absolute; inset:-6px; border-radius:14px; pointer-events:none;
    box-shadow:0 0 26px 6px rgba(255,108,92,.55); opacity:0; animation:liveGlow 4s ease-in-out infinite; }
  @keyframes liveGlow { 0%,100%{opacity:0} 50%{opacity:.8} }
  .live i { width:9px; height:9px; border-radius:2px; background:#fff; animation:blink 1.2s steps(1) infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
  .ch-logo { font-size:20px; font-weight:900; letter-spacing:1px; color:var(--ink);
    display:flex; align-items:center; gap:10px; white-space:nowrap; }
  .ch-logo .ai-star { width:38px; height:38px; border-radius:12px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0) 55%),
      linear-gradient(140deg,var(--pri),var(--vio)); color:#fff; font-size:20px;
    box-shadow:inset 0 1.5px 1px rgba(255,255,255,.7), 0 0 0 1px rgba(255,255,255,.35),
      3px 3px 0 rgba(79,124,255,.3), 0 6px 16px rgba(99,102,241,.45);
    animation:starSpin 6s steps(1) infinite; }
  @keyframes starSpin { 0%,88%,100%{transform:none} 90%{transform:rotate(90deg)} 92%{transform:rotate(180deg)}
    94%{transform:rotate(270deg)} 96%{transform:rotate(360deg)} }
  .grad-text { background:linear-gradient(92deg,var(--pri),var(--vio),#ff5c9d,#00b8d4,var(--pri));
    background-size:320% 100%;
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation:gradFlow 9s linear infinite; }
  @keyframes gradFlow { to { background-position:320% 0; } }
  .ch-logo em { font-style:normal; }
  .ch-logo small { display:block; font-size:11px; letter-spacing:3px; color:var(--sub); font-weight:500; }
  .pills { display:flex; gap:14px; margin-left:auto; margin-right:24px; }
  .pill { background:rgba(255,255,255,.85); border-radius:999px; padding:9px 22px;
    font-size:17px; color:var(--ink); white-space:nowrap;
    box-shadow:0 2px 10px rgba(90,90,150,.10); }
  .pill b { font-size:30px; font-weight:900; color:#7645e8; font-variant-numeric:tabular-nums; }
  .pill b.hot { color:#ff5c50; }
  .pill span.den { color:#85839f; }
  .ch-clock { text-align:right; font-size:12px; color:var(--sub); white-space:nowrap; }
  .ch-clock b { display:block; font-size:24px; color:var(--ink); letter-spacing:1px; }
  .ch-clock.warn { color:#e2543f; font-weight:700; }

  /* ============ 七队面板内容（对位烘焙面板） ============ */
  .slot { position:absolute; width:300px; height:325px; padding:24px 26px; }
  .s1 { left:171px; top:283px; }
  .s2 { left:591px; top:283px; }
  .s3 { left:1014px; top:283px; }
  .s4 { left:1434px; top:283px; }
  .s5 { left:395px; top:647px; height:320px; }
  .s6 { left:819px; top:647px; height:320px; }
  .s7 { left:1242px; top:647px; height:320px; }
  .t-label { font-size:15px; color:#6f9fd8; letter-spacing:2px; }
  /* 队名文字：印章风 logo 远距离不可读，补一行文字队名 */
  .t-label .t-name { font-size:19px; font-weight:900; color:#2c2a4e; letter-spacing:1px; }
  /* 平均积分：1 位小数 + 渐变流动 + count-up（渐变色动态显示） */
  .t-avg { margin-top:2px; font-size:46px; font-weight:900; line-height:1.15; }
  .t-avg .v { background:linear-gradient(92deg,#3f6df1,#22b1d8,#7c5ce0,#3f6df1);
    background-size:260% 100%;
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation:gradFlow 8s linear infinite; }
  .t-avg small { font-size:19px; font-weight:800; color:#3f88c9; margin-left:4px;
    -webkit-text-fill-color:initial; }
  .t-logo { position:absolute; top:22px; right:22px; width:86px; height:auto;
    filter:drop-shadow(0 4px 10px rgba(80,110,200,.25)); }
  .t-table { margin-top:16px; }
  .t-head { display:flex; justify-content:space-between; font-size:14px; color:#8fa3c8;
    padding-bottom:6px; border-bottom:1px solid rgba(120,140,190,.18); }
  .t-row { display:flex; justify-content:space-between; align-items:baseline;
    padding:5px 0; font-size:17px; }
  .t-row .n { font-weight:800; color:#33305c; }
  .t-row .n.long { font-size:13px; }
  .t-row .s { font-weight:900; color:#3f6df1; font-size:18px; }

  /* 前三名水晶面板：光带划过的闪耀效果（overflow 裁进面板圆角内） */
  .shine { position:absolute; inset:2px; border-radius:28px; overflow:hidden; pointer-events:none; }
  .shine::before { content:""; position:absolute; top:-30%; bottom:-30%; left:-60%; width:46%;
    background:linear-gradient(105deg, transparent,
      rgba(255,255,255,.7) 45%, rgba(214,230,255,.3) 60%, transparent);
    transform:rotate(12deg);
    animation:cardShine 6s ease-in-out infinite; }
  .s2 .shine::before { animation-delay:.9s; }
  .s3 .shine::before { animation-delay:1.8s; }
  @keyframes cardShine {
    0%   { transform:translateX(0) rotate(12deg); }
    45%  { transform:translateX(560%) rotate(12deg); }
    100% { transform:translateX(560%) rotate(12deg); } }

  /* ============ 底部节目单 ============ */
  footer.guide { position:absolute; left:0; right:0; bottom:0; height:60px; z-index:30;
    display:flex; align-items:center; justify-content:center; gap:10px; padding:0 30px;
    background:linear-gradient(0deg, rgba(255,255,255,.42), rgba(255,255,255,.18));
    backdrop-filter:blur(24px) saturate(1.6); -webkit-backdrop-filter:blur(24px) saturate(1.6);
    border-top:1px solid rgba(255,255,255,.7);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 -8px 24px rgba(74,96,180,.08); }
  .g-item { font-size:14px; color:var(--sub); padding:7px 16px; border-radius:8px; letter-spacing:1px;
    white-space:nowrap; text-decoration:none; }
  .g-item.on { color:#fff; font-weight:800;
    background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.06) 50%, rgba(255,255,255,0) 65%),
      linear-gradient(92deg,var(--pri),var(--vio));
    box-shadow:inset 0 1px 1px rgba(255,255,255,.8), inset 0 -4px 8px rgba(40,40,160,.25),
      0 0 0 1px rgba(255,255,255,.35), 3px 3px 0 rgba(79,124,255,.3), 0 6px 16px rgba(99,102,241,.45); }
  .g-note { position:absolute; right:30px; font-size:12px; color:var(--sub); }
  .g-note b { color:var(--vio); }

  .preview-badge { position:absolute; top:96px; right:28px; z-index:35; display:none;
    background:rgba(255,176,32,.92); color:#5b3c00;
    font-size:13px; font-weight:700; padding:5px 14px; border-radius:999px; }
  .unassigned-badge { position:absolute; top:134px; right:28px; z-index:35; display:none;
    background:rgba(226,84,63,.94); color:#fff;
    font-size:13px; font-weight:700; padding:5px 14px; border-radius:999px; }

  @media (prefers-reduced-motion: reduce) {
    .live::after, .ai-star, .grad-text, .live i, .fx i,
    .shine::before, .t-avg .v { animation:none; }
    body { animation:none; }
  }
</style>
</head>
<body>
<div id="stage">
  <div class="fx"><i class="sweep"></i><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>

  <header class="ch">
    <div class="live"><i></i>LIVE</div>
    <div class="ch-logo">
      <span class="ai-star">✦</span>
      <div>2026莱莎采购节 · <em class="grad-text">新签/首返/复购赛事实时大屏</em>
        <small>2026 PROCUREMENT FESTIVAL · AI-POWERED SALES LIVE</small>
      </div>
    </div>
    <div class="pills">
      <div class="pill">8月新签 <b class="num" id="newTotal">--</b> <span class="den">/ <span id="newTarget">143</span></span></div>
      <div class="pill">8+9月业绩 <b class="num" id="gmvTotal">--</b> <span class="den">/ <span id="gmvTarget">$3,260,000</span></span></div>
      <div class="pill"><span id="phaseLabel">--</span> <b class="num hot" id="phaseDays">--</b> 天</div>
    </div>
    <div class="ch-clock" id="clockBox"><b class="num" id="clock">--:--:--</b><span id="dateline">加载中…</span></div>
  </header>

  <div class="preview-badge" id="previewBadge">预览数据窗口</div>
  <div class="unassigned-badge" id="unassignedBadge"></div>

  <div id="slots"></div>

  <footer class="guide">
    <a class="g-item" href="zhaiyao.html">摘要大屏</a>
    <a class="g-item" href="xinqian.html">个人新签榜</a>
    <a class="g-item" href="fugou.html">首返·复购榜</a>
    <a class="g-item" href="zhenying.html">阵营PK榜</a>
    <a class="g-item on" href="tuandui.html">团队积分榜</a>
    <span class="g-note">团队积分 = Σ成员周年加权积分 · 人均前三 <b>2188/1588/888</b> · 并列比人均复购金额</span>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var REFRESH_MS = 60 * 1000;
  var STALE_MS = 5 * 60 * 1000;
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var qs = new URLSearchParams(location.search);

  var LOGOS = {
    "专治不服": "zhuanzhibufu", "多财多亿": "duocaiduoyi", "稻乐偲": "daolesi",
    "星星之火": "xingxingzhihuo", "行则将至": "xingzejiangzhi", "乘风": "chengfeng",
    "无名": "wuming"
  };

  var stage = document.getElementById("stage");
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();

  /* 底栏导航透传 key/preview 参数（fail-closed 门禁下裸链接会 403 死屏） */
  if (location.search) {
    document.querySelectorAll(".g-item[href]").forEach(function (a) {
      var href = a.getAttribute("href");
      if (href && href.slice(-5) === ".html") a.setAttribute("href", href + location.search);
    });
  }

  /* 轮播：每屏停留 30s 切下一屏（URL 加 &stay=1 可固定本屏） */
  if (qs.get("stay") !== "1") {
    setTimeout(() => { location.href = "zhaiyao.html" + location.search; }, 30000);
  }

  var WEEK = ["周日","周一","周二","周三","周四","周五","周六"];
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  var lastFetchAt = Date.now(), asOfText = "--:--";
  function tickClock() {
    var d = new Date();
    document.getElementById("clock").textContent =
      pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    document.getElementById("dateline").textContent =
      d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate())
      + " " + WEEK[d.getDay()] + " · 数据截至 " + asOfText;
    document.getElementById("clockBox").classList.toggle(
      "warn", Date.now() - lastFetchAt > STALE_MS);
    var day = 24 * 3600 * 1000;
    var t0 = new Date("2026-08-01T00:00:00"), t1 = new Date("2026-09-01T00:00:00"),
        t2 = new Date("2026-10-01T00:00:00");
    var lab, dd;
    if (d < t0) { lab = "\u8ddd\u5f00\u8d5b"; dd = Math.ceil((t0 - d) / day); }
    else if (d < t1) { lab = "\u65b0\u7b7e\u7ade\u8d5b\u5012\u8ba1\u65f6"; dd = Math.ceil((t1 - d) / day); }
    else if (d < t2) { lab = "\u9996\u8fd4/\u590d\u8d2d\u7ade\u8d5b\u5012\u8ba1\u65f6"; dd = Math.ceil((t2 - d) / day); }
    else { lab = "\u6d3b\u52a8\u5df2\u6536\u5b98"; dd = 0; }
    document.getElementById("phaseLabel").textContent = lab;
    document.getElementById("phaseDays").textContent = dd;
  }
  setInterval(tickClock, 1000);
  tickClock();

  function apiUrl() {
    var p = new URLSearchParams();
    if (qs.get("key")) p.set("key", qs.get("key"));
    if (qs.get("preview") === "1") {
      p.set("date_from", qs.get("date_from") || "2026-06-01");
      p.set("date_to", qs.get("date_to") || "2026-07-29");
    } else {
      if (qs.get("date_from")) p.set("date_from", qs.get("date_from"));
      if (qs.get("date_to")) p.set("date_to", qs.get("date_to"));
    }
    var query = p.toString();
    return "/api/public/festival/teams" + (query ? "?" + query : "");
  }

  function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
  function fmtInt(v) { return String(Math.round(v)); }
  function fmt1(v) { return v.toFixed(1); }   /* 平均积分保留 1 位小数 */
  function countTo(el, target, fmt) {
    fmt = fmt || fmtInt;
    var from = parseFloat(el.dataset.value || "0") || 0;
    if (from === target || reduceMotion) {
      el.dataset.value = target; el.textContent = fmt(target); return;
    }
    var start = null;
    function step(ts) {
      if (!start) start = ts;
      var t = Math.min((ts - start) / 700, 1);
      el.textContent = fmt(from + (target - from) * easeOutQuart(t));
      if (t < 1) requestAnimationFrame(step);
      else { el.dataset.value = target; el.textContent = fmt(target); }
    }
    requestAnimationFrame(step);
  }
  function fmtGmv(v) { return "$" + Math.round(v).toLocaleString("en-US"); }

  /* 七个面板槽位：排名即位置（背景已烘焙 1/2/3 徽章在上排前三格下方） */
  var slotsBox = document.getElementById("slots");
  var slots = [];
  for (var i = 1; i <= 7; i++) {
    var el = document.createElement("div");
    el.className = "slot s" + i;
    el.innerHTML =
      (i <= 3 ? '<div class="shine"></div>' : "") +
      '<div class="t-label"><span class="t-name">--</span> · 平均积分</div>' +
      '<div class="t-avg"><span class="v num" data-value="0">0.0</span><small>分</small></div>' +
      '<img class="t-logo" alt="" style="display:none">' +
      '<div class="t-table"><div class="t-head"><span>姓名</span><span>总积分</span></div>' +
      '<div class="t-rows"></div></div>';
    slotsBox.appendChild(el);
    slots.push(el);
  }

  function render(data) {
    var teams = data.teams || [];
    teams.forEach(function (team, i) {
      if (i >= slots.length) return;
      var el = slots[i];
      el.querySelector(".t-name").textContent = team.name;
      countTo(el.querySelector(".t-avg .v"), team.avg, fmt1);
      var logo = el.querySelector(".t-logo");
      var key = LOGOS[team.name];
      if (key) {
        var want = "assets/team-logos/" + key + ".png";
        if (logo.getAttribute("src") !== want) logo.setAttribute("src", want);
        logo.style.display = "block";
      } else {
        logo.style.display = "none";
      }
      var rowsBox = el.querySelector(".t-rows");
      /* 行数对齐成员数（复用 DOM 保 count-up 连续性） */
      while (rowsBox.children.length < team.members.length) {
        var row = document.createElement("div");
        row.className = "t-row";
        row.innerHTML = '<span class="n"></span><span class="s num" data-value="0">0.0</span>';
        rowsBox.appendChild(row);
      }
      while (rowsBox.children.length > team.members.length) {
        rowsBox.removeChild(rowsBox.lastChild);
      }
      team.members.forEach(function (m, j) {
        var row = rowsBox.children[j];
        var nameEl = row.querySelector(".n");
        if (nameEl.textContent !== m.name) nameEl.textContent = m.name;
        nameEl.classList.toggle("long", m.name.length > 5);
        countTo(row.querySelector(".s"), m.score, fmt1);
      });
    });

    var s = data.summary || {};
    countTo(document.getElementById("newTotal"), s.new_total || 0);
    document.getElementById("newTarget").textContent = s.new_target || 143;
    countTo(document.getElementById("gmvTotal"), s.gmv_total || 0, fmtGmv);
    document.getElementById("gmvTarget").textContent = fmtGmv(s.gmv_target || 3260000);

    if (s.window && s.window.preview) {
      var badge = document.getElementById("previewBadge");
      badge.style.display = "block";
      badge.textContent = "预览数据 " + s.window.from + " ~ " + s.window.to;
    }
    var ub = document.getElementById("unassignedBadge");
    if (data.unassigned > 0) {
      ub.style.display = "block";
      ub.textContent = "⚠ " + data.unassigned + " 人未归入任何分队（检查 user_rel_team.Team）";
    } else {
      ub.style.display = "none";
    }
  }

  function refresh() {
    fetch(apiUrl())
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (body) {
        var data = body.data || body;
        lastFetchAt = Date.now();
        asOfText = (data.as_of || "").slice(11, 16) || "--:--";
        render(data);
        tickClock();
      })
      .catch(function () { tickClock(); });
  }
  refresh();
  setInterval(refresh, REFRESH_MS);
})();
</script>
</body>
