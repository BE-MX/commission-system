<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <title>LeShine 客户专属素材库</title>
  <style>
    :root{--gold:#d4941c;--gold-dark:#a86f10;--ink:#1d1b18;--muted:#746f67;--line:rgba(61,51,35,.13);--paper:#f7f2e8;--card:rgba(255,255,255,.78);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0,rgba(245,203,92,.34),transparent 34%),radial-gradient(circle at 0 55%,rgba(232,173,106,.2),transparent 30%),linear-gradient(150deg,#fffaf1,#f4eee4)}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.04em}.brand-mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:white;font:800 22px Georgia,serif;box-shadow:0 7px 18px rgba(168,111,16,.22)}.brand small{display:block;color:var(--muted);font-weight:500;letter-spacing:.08em;font-size:10px;margin-top:3px}
    .login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(430px,100%);padding:34px;border:1px solid rgba(255,255,255,.85);border-radius:24px;background:rgba(255,255,255,.66);box-shadow:0 22px 70px rgba(117,79,24,.16);backdrop-filter:blur(18px)}.login-card h1{font-size:30px;margin:34px 0 8px}.login-card>p{color:var(--muted);line-height:1.7;margin:0 0 28px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;font-weight:700;color:#5d554b}.field input{height:46px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.85);padding:0 14px;outline:none}.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,148,28,.12)}.primary{width:100%;height:46px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:white;font-weight:700;margin-top:10px;box-shadow:0 9px 20px rgba(168,111,16,.2)}.error{min-height:21px;color:#b42332;font-size:13px;margin-top:12px}
    .app{min-height:100vh}.topbar{height:72px;padding:0 max(24px,calc((100vw - 1320px)/2));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(255,255,255,.64);backdrop-filter:blur(14px);position:sticky;top:0;z-index:4}.account{text-align:right}.account strong,.account span{display:block}.account span{font-size:12px;color:var(--muted);margin-top:3px}.logout{margin-left:18px;border:1px solid var(--line);border-radius:10px;background:white;padding:8px 12px}
    main{max-width:1320px;margin:0 auto;padding:42px 24px 70px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:28px}.eyebrow{color:var(--gold-dark);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.hero h1{font-size:clamp(30px,4vw,50px);margin:10px 0 8px;letter-spacing:-.03em}.hero p{margin:0;color:var(--muted)}.stats{display:flex;gap:12px}.stat{min-width:110px;padding:14px 18px;border:1px solid var(--line);border-radius:16px;background:var(--card)}.stat strong{display:block;font-size:24px}.stat span{color:var(--muted);font-size:12px}
    .toolbar{display:flex;gap:12px;margin-bottom:28px}.toolbar input{flex:1;max-width:440px;height:42px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.8)}.batch{margin:0 0 34px}.batch-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.batch-head h2{font-size:19px;margin:0 0 4px}.batch-head span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.asset{border:1px solid rgba(255,255,255,.85);border-radius:18px;background:var(--card);box-shadow:0 9px 30px rgba(117,79,24,.1);overflow:hidden}.media{width:100%;aspect-ratio:4/3;display:block;object-fit:cover;background:#e9e5df}.asset img{cursor:zoom-in}.meta{padding:13px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center}.meta strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.download{flex:0 0 auto;color:var(--gold-dark);text-decoration:none;font-size:12px;font-weight:700}.empty{text-align:center;color:var(--muted);padding:80px 20px;border:1px dashed var(--line);border-radius:18px}
    .lightbox{position:fixed;inset:0;background:rgba(16,14,12,.88);display:grid;place-items:center;z-index:10;padding:30px}.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain}.lightbox button{position:absolute;right:22px;top:18px;background:none;border:0;color:white;font-size:34px}
    @media(max-width:700px){.topbar{padding:0 16px}.account{display:none}main{padding:28px 16px}.hero{align-items:flex-start;flex-direction:column}.stats{width:100%}.stat{flex:1;min-width:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.meta{display:grid}.asset{border-radius:13px}.brand span{font-size:13px}}
  </style>
</head>
<body>
  <section id="login" class="login"><form id="login-form" class="login-card"><div class="brand"><span class="brand-mark" aria-hidden="true">L</span><span>LESHINE<small>CLIENT CONTENT HUB</small></span></div><h1>客户专属素材库</h1><p>安全查看和下载由 LeShine 团队为您完成的拍摄素材。</p><div class="field"><label for="email">登录邮箱</label><input id="email" type="email" autocomplete="username" required /></div><div class="field"><label for="password">登录密码</label><input id="password" type="password" autocomplete="current-password" required /></div><button class="primary" type="submit">登录素材库</button><div id="error" class="error" role="alert"></div></form></section>
  <section id="app" class="app hidden"><header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">L</span><span>LESHINE<small>CLIENT CONTENT HUB</small></span></div><div style="display:flex;align-items:center"><div class="account"><strong id="customer-name"></strong><span id="customer-id"></span></div><button id="logout" class="logout">退出</button></div></header><main><section class="hero"><div><div class="eyebrow">Your Content Archive</div><h1>您的专属拍摄素材</h1><p>按拍摄批次归档，所有下载均为审核通过的原始文件。</p></div><div class="stats"><div class="stat"><strong id="image-count">0</strong><span>图片</span></div><div class="stat"><strong id="video-count">0</strong><span>视频</span></div></div></section><div class="toolbar"><input id="search" placeholder="搜索文件名" /></div><div id="library"></div></main></section>
  <div id="lightbox" class="lightbox hidden"><button aria-label="关闭">×</button><img alt="素材预览" /></div>
  <script>
    const API='/api/customer-media/portal';let batches=[];const $=id=>document.getElementById(id);function size(n){return n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}function date(v){return v?new Date(v).toLocaleString('zh-CN',{year:'numeric',month:'long',day:'numeric'}):''}
    async function request(path,opt={}){const r=await fetch(API+path,{credentials:'same-origin',...opt});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.detail||data.message||'请求失败');return data.data}
    function showLogin(){ $('login').classList.remove('hidden');$('app').classList.add('hidden') }function showApp(me){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('customer-name').textContent=me.customer_name;$('customer-id').textContent='客户ID '+me.customer_id}
    function render(){const q=$('search').value.trim().toLowerCase();let images=0,videos=0;const html=batches.map((batch,index)=>{const assets=batch.assets.filter(a=>a.file_name.toLowerCase().includes(q));assets.forEach(a=>a.media_type==='image'?images++:videos++);if(!assets.length)return'';return `<section class="batch"><div class="batch-head"><div><h2>拍摄交付 ${batches.length-index}</h2><span>${date(batch.published_at)} · ${assets.length} 个文件</span></div></div><div class="grid">${assets.map(a=>`<article class="asset">${a.media_type==='image'?`<img class="media preview" src="${a.content_url}" data-src="${a.content_url}" alt="${escapeAttr(a.file_name)}" loading="lazy">`:`<video class="media" src="${a.content_url}" controls preload="metadata"></video>`}<div class="meta"><div style="min-width:0"><strong title="${escapeAttr(a.file_name)}">${escapeHtml(a.file_name)}</strong><div style="font-size:11px;color:var(--muted);margin-top:3px">${size(a.file_size)}</div></div><a class="download" href="${a.content_url}?download=true">下载</a></div></article>`).join('')}</div></section>`}).join('');$('library').innerHTML=html||'<div class="empty">暂无已发布素材</div>';$('image-count').textContent=images;$('video-count').textContent=videos;document.querySelectorAll('.preview').forEach(img=>img.onclick=()=>{$('lightbox').querySelector('img').src=img.dataset.src;$('lightbox').classList.remove('hidden')})}
    function escapeHtml(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}function escapeAttr(v){return escapeHtml(v).replaceAll('&quot;','&#34;').replaceAll("'",'&#39;')}
    async function load(){try{const me=await request('/me');showApp(me);batches=await request('/library');render()}catch{showLogin()}}
    $('login-form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';try{const me=await request('/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});showApp(me);batches=await request('/library');render()}catch(err){$('error').textContent=err.message}}
    $('logout').onclick=async()=>{await request('/logout',{method:'POST'}).catch(()=>{});showLogin()};$('search').oninput=render;$('lightbox').onclick=e=>{if(e.target!==$('lightbox').querySelector('img'))$('lightbox').classList.add('hidden')};load()
  </script>
</body>
</html>
