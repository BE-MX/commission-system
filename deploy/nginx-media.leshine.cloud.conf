# media.leshine.cloud - 客户素材门户
# 部署位置：/etc/nginx/conf.d/media.leshine.cloud.conf

server {
    listen 80;
    server_name media.leshine.cloud;

    # HTTP 跳转 HTTPS（证书申请完成后启用）
    # return 301 https://$server_name$request_uri;

    # Let's Encrypt webroot 验证路径（证书申请时需要）
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 临时：证书申请前先通过 HTTP 测试
    location / {
        root /var/www/ark-dist/customer-media;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/customer-media/portal {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

