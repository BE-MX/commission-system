# BEGIN ARK TEAMROUTER CHAT
location = /_ark/teamrouter/v1/messages {
    secure_link "__ARK_VERIFIER__";
    secure_link_md5 "ark-teamrouter-chat-v1|$http_x_api_key";
    if ($secure_link = "") { return 403; }
    if ($request_method != POST) { return 405; }
    if ($request_uri ~ "[?]") { return 400; }
    client_max_body_size 32m;
    client_body_timeout 600s;
    access_log off;
    error_log /dev/null crit;
    proxy_pass https://api.teamorouter.com/v1/messages;
    proxy_ssl_server_name on;
    proxy_ssl_name api.teamorouter.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host api.teamorouter.com;
    proxy_set_header X-Api-Key $http_x_api_key;
    proxy_set_header Anthropic-Version $http_anthropic_version;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Accept application/json;
    proxy_set_header Connection "";
    proxy_cache off;
    proxy_no_cache 1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_next_upstream off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
# END ARK TEAMROUTER CHAT
