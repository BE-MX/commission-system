# Singapore: customer media stays on Beijing until COS migration is explicitly resumed.
location ^~ /api/customer-media/ {
    client_max_body_size 501m;
    proxy_request_buffering off;
    proxy_pass https://154.8.205.162;
    proxy_ssl_server_name on;
    proxy_ssl_name media.leshine.cloud;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_http_version 1.1;
    proxy_set_header Host media.leshine.cloud;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
