# One Beijing owner for SSO, sessions, assets and inventory files.
location ^~ /api/colorwork/ {
    client_max_body_size 26m;
    proxy_pass https://154.8.205.162;
    proxy_ssl_server_name on;
    proxy_ssl_name leshine.cloud;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_http_version 1.1;
    proxy_set_header Host leshine.cloud;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Translate only the two known public origins to the upstream origin.
    # Unknown origins pass through unchanged and remain subject to the API CSRF guard.
    set $colorwork_origin $http_origin;
    if ($http_origin = "https://leshine.work") { set $colorwork_origin https://leshine.cloud; }
    if ($http_origin = "https://www.leshine.work") { set $colorwork_origin https://leshine.cloud; }
    proxy_set_header Origin $colorwork_origin;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_next_upstream off;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # SSO query strings contain short-lived tokens.
    access_log off;
    add_header Cache-Control "private, no-store" always;
}
