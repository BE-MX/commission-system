# 客户素材门户独立站。先以 `nginx -t` 校验，再按服务器现有 include 方式启用。
# 存储根 /data/customer-media 绝不能放入 root 或 alias。
server {
    listen 80;
    listen [::]:80;
    server_name media.leshine.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.leshine.cloud;

    ssl_certificate /etc/letsencrypt/live/media.leshine.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.leshine.cloud/privkey.pem;

    client_max_body_size 501m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    # 仅暴露客户素材模块；云端进程即便加载完整方舟应用，其他 API 也不会公网开放。
    location ^~ /api/customer-media/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    root /srv/ark-customer-media;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
