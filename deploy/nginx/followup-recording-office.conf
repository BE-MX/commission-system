# The .work entry reaches the office through frp; large uploads stall the shared tunnel
# (runbook Q9). Refuse recordings here and point users to leshine.cloud or the LAN entry.
location ~ ^/api/domestic-followup/recordings$ {
    client_max_body_size 1k;
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    return 413 '{"code":413,"message":"录音请从 leshine.cloud 或公司内网入口上传"}';
}
