# Include inside the leshine.work HTTPS server block before the generic /api location.
# The application accepts 10 MiB image bytes; 11m leaves multipart framing overhead.
location ~ ^/api/knowledge/libraries/[0-9]+/assets$ {
    client_max_body_size 11m;
    proxy_pass http://127.0.0.1:8002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
