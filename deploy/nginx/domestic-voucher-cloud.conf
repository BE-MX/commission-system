# Beijing forwards the original URI and user token to the office via Singapore.
location ~ ^/api/domestic/(customers/[0-9]+/recharges|customer-requests/[0-9]+/voucher)$ {
    client_max_body_size 21m;
    proxy_pass https://119.28.107.92;
    proxy_ssl_server_name on;
    proxy_ssl_name leshine.work;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_http_version 1.1;
    proxy_set_header Host leshine.work;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_next_upstream off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    add_header Cache-Control "private, no-store" always;
}
