# Include inside the leshine.work HTTPS server block. Candidate config only.
# Match the existing Ark upstream (the main MCP location also uses port 8002).
location = /api/ai-gateway/chat {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_next_upstream off;
    # Avoid exposing query strings or headers through upstream error logs.
    access_log off;
    error_page 413 = @ark_ai_gateway_too_large;
}

location @ark_ai_gateway_too_large {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 413 '{"code":413,"message":"Request body exceeds 64 KiB","data":{"error":"payload_too_large","request_id":null}}';
}
