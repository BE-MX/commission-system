# Preserve this host's existing shipping backend and private file ownership.
location = /api/mini/shipping-inspection/videos {
    client_max_body_size 101m;
    client_body_timeout 300s;
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_next_upstream off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    add_header Cache-Control "private, no-store" always;
}

# Shared-phone uploads stay on the same private storage owner.
location ~ ^/api/shipping-inspection/station/sessions/[0-9a-f-]+/photos$ {
    client_max_body_size 21m;
    client_body_timeout 300s;
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_next_upstream off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    add_header Cache-Control "private, no-store" always;
}

# Shared-phone uploads stay on the same private storage owner.
location ~ ^/api/shipping-inspection/station/sessions/[0-9a-f-]+/videos$ {
