# Managed include for every Nginx `server` block that serves /expo/kiosk.
# Install as /etc/nginx/snippets/expo-kiosk-updates.conf, then include it from
# the HTTPS IP server (and the HTTP fallback server while that origin remains supported).
# Files are deliberately outside /var/www/ark-dist so frontend rsync --delete cannot remove them.

location = /expo-app/latest.json {
    alias /var/www/ark-updates/expo-kiosk/latest.json;
    autoindex off;
    types { }
    default_type application/json;
    add_header Cache-Control "no-store" always;
}

location = /expo-app/leshine-expo-kiosk.apk {
    alias /var/www/ark-updates/expo-kiosk/leshine-expo-kiosk.apk;
    autoindex off;
    types { }
    default_type application/vnd.android.package-archive;
    add_header Cache-Control "no-store" always;
}
