server {
    listen 80;
    server_name hair.leshine.cloud;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name hair.leshine.cloud;
    ssl_certificate /etc/letsencrypt/live/hair.leshine.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hair.leshine.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/hair-styles;
    index index.html;
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
