# 库存色块图工作台子站（colorwork-workbench，vinext/Worker 本地运行）。
# 仅允许被方舟主站 iframe 嵌入（frame-ancestors 白名单），独立直开也能用但无登录页——
# 未持方舟 SSO 会话只会看到「请从方舟平台进入」。
# 先 `nginx -t` 校验，再按服务器现有 include 方式启用；DNS/证书未就绪前列为 pending。
server {
    listen 80;
    listen [::]:80;
    server_name colorwork.leshine.work;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name colorwork.leshine.work;

    ssl_certificate /etc/letsencrypt/live/colorwork.leshine.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/colorwork.leshine.work/privkey.pem;

    # PSD 源文件分片上传（单分片 8MB，并发多片），给足余量
    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # 只允许方舟主站 iframe 嵌入（同源 + leshine.work 主站）
    add_header Content-Security-Policy "frame-ancestors 'self' https://leshine.work https://www.leshine.work" always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
