# Ark-owned minimal composition. Intentionally no shell, filesystem, editor,
# job, skill, subagent, browser or workspace-context plugin.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    streamIdleTimeoutMs: 360000
    models:
      - id: !!js process.env.DSH_MODEL
        contextWindow: 128000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.DSH_SYSTEM_PROMPT
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: ark-mcp
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: ark
    transport: streamable-http
    url: !!js process.env.ARK_MCP_URL
    headers:
      Authorization: !!js '`Bearer ${process.env.MCP_TOKEN}`'
    toolCallTimeoutMs: 60000
    failOnStartupError: true
    reconnect:
      enabled: true
      initialDelayMs: 500
      maxDelayMs: 5000
      maxAttempts: 3

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: none

