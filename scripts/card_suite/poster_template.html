<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>leShine expo poster A1</title>
<style>
  :root { --yellow: {{BRAND_YELLOW}}; --black: #101010; --ink: #171717; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @page { size: 600mm 847mm; margin: 0; }
  html, body { width: 600mm; }
  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .page { position: relative; width: 600mm; height: 847mm; background: var(--yellow); overflow: hidden; }

  /* 举牌场景：内容区均布，人群中一眼读完 —— 层级只有四级，无一处小字段落 */
  .content {
    position: absolute; top: 0; left: 0; right: 0; bottom: 196mm;
    display: flex; flex-direction: column; align-items: center;
    justify-content: space-evenly; padding: 24mm 14mm 8mm;
  }

  .logo { display: block; width: 148mm; }

  .herowrap { text-align: center; }
  .kicker {
    font-size: 25mm; font-weight: 800; letter-spacing: 7.5mm; text-indent: 7.5mm;
    text-transform: uppercase; color: var(--ink);
  }
  .hero {
    margin-top: 6mm;
    font-size: 80mm; line-height: 0.98; font-weight: 800; letter-spacing: -1mm; color: var(--ink);
    text-transform: uppercase; white-space: nowrap;
  }
  .badge {
    display: inline-block; margin-top: 11mm; background: var(--black); color: var(--yellow);
    font-size: 14.5mm; font-weight: 800; letter-spacing: 2.4mm; text-transform: uppercase;
    border-radius: 99mm; padding: 5.5mm 15mm 6.5mm;
  }

  .offer {
    width: 500mm; background: var(--black); border-radius: 12mm;
    padding: 17mm 20mm 19mm; text-align: center;
  }
  .offer .l1 { font-size: 27mm; font-weight: 800; letter-spacing: 0.8mm; color: #ffffff; text-transform: uppercase; }
  .offer .l2 { margin-top: 7mm; font-size: 19.5mm; font-weight: 700; color: var(--yellow); }
  .offer .l2 b { text-decoration: underline; text-underline-offset: 3.5mm; text-decoration-thickness: 2mm; }

  .bonus {
    border: 1.6mm solid var(--ink); border-radius: 99mm;
    padding: 5mm 14mm 6mm; text-align: center;
    font-size: 9.5mm; font-weight: 700; letter-spacing: 0.7mm; color: var(--ink);
    text-transform: uppercase;
  }
  .bonus .free { background: var(--ink); color: var(--yellow); border-radius: 99mm; padding: 1.6mm 6mm 2mm; margin-right: 5mm; }

  /* 扫码引导排：左=福利+手写 Scan me!+手绘箭头，右=大二维码 */
  .scanrow { display: flex; align-items: center; justify-content: center; gap: 8mm; }
  .scanleft { display: flex; flex-direction: column; align-items: center; gap: 7mm; }
  .scanme {
    font-family: "Segoe Script", "Comic Sans MS", cursive;
    font-size: 27mm; font-weight: 700; color: var(--ink);
    transform: rotate(-5deg);
  }
  .arrow { width: 105mm; height: 62mm; transform: rotate(6deg); }
  .qrbig { background: #ffffff; border-radius: 10mm; padding: 5mm; }
  .qrbig img { display: block; width: 132mm; height: 132mm; }

  .band {
    position: absolute; left: 0; right: 0; bottom: 0; height: 196mm; background: var(--black);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .band .boothlbl {
    font-size: 14.5mm; font-weight: 700; letter-spacing: 4.5mm; text-indent: 4.5mm;
    text-transform: uppercase; color: #ffffff;
  }
  .band .boothno {
    margin-top: 3mm; font-size: 118mm; line-height: 1; font-weight: 800;
    letter-spacing: 1mm; color: var(--yellow); white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="content">
      <img class="logo" src="{{LOGO_BLACK_URI}}" alt="leShine Hair">

      <div class="herowrap">
        <div class="kicker">Hair Extensions</div>
        <div class="hero">Genius Weft</div>
        <div><span class="badge">The Patent-Source Factory</span></div>
      </div>

      <div class="offer">
        <div class="l1">All Colors &middot; In Stock</div>
        <div class="l2">Show-special sample prices &mdash; <b>TODAY</b></div>
      </div>

      <div class="scanrow">
        <div class="scanleft">
          <div class="bonus"><span class="free">Free</span>AI Hair Try-On &middot; AI Portrait &amp; Frame</div>
          <div class="scanme">Scan me!</div>
          <svg class="arrow" viewBox="0 0 200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 28 C 66 -6, 118 92, 178 62" stroke="#171717" stroke-width="9"
                  stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M178 62 L 152 60 M178 62 L 167 39" stroke="#171717" stroke-width="9"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="qrbig"><img src="{{QR_URI}}" alt="QR"></div>
      </div>
    </div>

    <div class="band">
      <div class="boothlbl">Second Floor &middot; Booth</div>
      <div class="boothno">{{BOOTH}}</div>
    </div>
  </div>
</body>
</html>
