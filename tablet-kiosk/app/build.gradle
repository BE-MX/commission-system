plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def releaseSigningFile = rootProject.file('keystore.properties')
def releaseSigning = new Properties()
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}
def releaseRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains('release')
}
def releaseSigningValuesPresent = releaseSigningKeys.every {
    releaseSigning.getProperty(it)?.trim()
}
def releaseStoreFile = releaseSigningValuesPresent ? rootProject.file(releaseSigning.getProperty('storeFile').trim()) : null
def releaseSigningReady = releaseSigningValuesPresent && releaseStoreFile.isFile()

android {
    namespace 'com.leshine.expokiosk'
    compileSdk 35

    defaultConfig {
        applicationId "com.leshine.expokiosk"
        minSdk 26            // Android 8.0+，适配自适应图标，覆盖现代展会平板
        targetSdk 35
        versionCode 10
        versionName "1.9"
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile releaseStoreFile
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

if (releaseRequested && !releaseSigningReady) {
    throw new GradleException(
        'Release signing is not configured. Copy keystore.properties.example to keystore.properties, ' +
        'fill storeFile/storePassword/keyAlias/keyPassword, and make sure storeFile exists.'
    )
}
