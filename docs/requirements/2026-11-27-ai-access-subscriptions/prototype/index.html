<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 接入管理 · v0.3 交互原型（示例数据）</title>
<style>
  /* 配色与动效令牌取自 frontend/src/styles/tokens.css 与 DESIGN.md */
  :root {
    --gold: #E0A50B; --gold-hover: #C9930A; --gold-ink: #211903;
    --gold-soft: #FDF6DD; --gold-border: #F0D889; --gold-text: #8F6508;
    --ink: #1a1a2e; --ink-2: #4a5568; --muted: #5B6678;
    --line: #e2e5ef; --line-soft: #edf0f7; --card: #FFFFFF;
    --ok: #0D9488; --ok-soft: #E4F7F3; --ok-border: #A8E3D6; --ok-text: #0B6E63;
    --warn: #C2610A; --warn-soft: #FEF0DE; --warn-border: #F4CCA0; --warn-text: #9A4E08;
    --danger: #E5484D; --danger-soft: #FDEBEC; --danger-border: #F6C6CA; --danger-text: #C62A30;
    --info: #2563EB; --info-soft: #EBF1FE; --info-border: #BFD4FB; --info-text: #1D4ED8;
    --neutral: #64748B; --neutral-soft: #F6F7F9; --neutral-border: #E2E5EA; --neutral-text: #4A5563;
    --glass-bg: linear-gradient(160deg, rgba(255,255,255,.88), rgba(255,255,255,.72));
    --glass-border: rgba(255,255,255,.92);
    --glass-shadow: 0 8px 24px rgba(146, 103, 24, 0.10), inset 0 1px 0 rgba(255,255,255,.92);
    --glass-shadow-hover: 0 12px 30px rgba(146, 103, 24, 0.15), inset 0 1px 0 rgba(255,255,255,.95);
    --font-display: "Outfit", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --font-body: "DM Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --ease-out-strong: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    --motion-press: 120ms;
    --motion-fast: 160ms;
    --motion-base: 220ms;
    --motion-sheet: 320ms;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    background:
      radial-gradient(ellipse 680px 340px at 88% 0%, rgba(245, 203, 92, 0.28), transparent 68%),
      radial-gradient(ellipse 560px 320px at 10% 35%, rgba(230, 160, 60, 0.16), transparent 68%),
      radial-gradient(ellipse 600px 360px at 80% 90%, rgba(242, 165, 110, 0.16), transparent 68%),
      linear-gradient(155deg, #fdf8ec 0%, #f8f3ea 52%, #f9efe7 100%);
  }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--font-mono); }
  .hidden { display: none !important; }

  /* 顶栏与导航 */
  header.top {
    background: linear-gradient(90deg, #262a33, #1e2129);
    color: #F5F2EE;
    padding: 13px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  header.top .crumb { opacity: .65; font-size: 13px; white-space: nowrap; }
  header.top h1 { font: 700 17px var(--font-display); margin: 0; white-space: nowrap; }
  header.top .badge-ver { font-size: 11px; font-weight: 700; background: rgba(245,203,92,.18); color: #F5CB5C; border: 1px solid rgba(245,203,92,.35); border-radius: 6px; padding: 1px 7px; }
  header.top .note { margin-left: auto; font-size: 12px; opacity: .75; }

  nav.tabs {
    display: flex;
    gap: 4px;
    padding: 0 24px;
    background: rgba(255,255,255,.78);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    border: 0;
    background: none;
    padding: 13px 14px;
    font: 600 14px var(--font-display);
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color var(--motion-fast) ease, border-color var(--motion-fast) ease;
  }
  nav.tabs button.on { color: var(--ink); border-bottom-color: var(--gold); }
  nav.tabs button .cnt { font-size: 11px; font-weight: 700; background: var(--neutral-soft); color: var(--neutral-text); border-radius: 999px; padding: 0 6px; line-height: 18px; }
  nav.tabs button.on .cnt { background: var(--gold-soft); color: var(--gold-text); }
  nav.tabs .new { font-size: 10px; font-weight: 700; background: var(--gold); color: var(--gold-ink); border-radius: 4px; padding: 1px 5px; }

  main { padding: 18px 24px 56px; max-width: 1440px; margin: 0 auto; }

  /* 迁移提示 */
  .notice {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px; margin-bottom: 14px;
    background: var(--gold-soft); border: 1px solid var(--gold-border); border-radius: 10px;
    color: var(--gold-text); font-size: 13px;
  }
  .notice button { margin-left: auto; border: 0; background: none; color: var(--gold-text); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 6px; }

  /* 顶部汇总卡（对齐 DESIGN.md 看板概览卡片规范） */
  .summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat {
    --m-ink: var(--neutral-text); --m-bg: var(--neutral-soft);
    position: relative; overflow: hidden; isolation: isolate;
    background: linear-gradient(145deg, rgba(255,255,255,.92), var(--m-bg));
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    border-radius: 14px; padding: 14px 16px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    text-align: left; font: inherit; color: var(--ink);
  }
  .stat.t-gold { --m-ink: var(--gold-text); --m-bg: var(--gold-soft); }
  .stat.t-info { --m-ink: var(--info-text); --m-bg: var(--info-soft); }
  .stat.t-ok { --m-ink: var(--ok-text); --m-bg: var(--ok-soft); }
  .stat.t-warn { --m-ink: var(--warn-text); --m-bg: var(--warn-soft); }
  .stat.t-danger { --m-ink: var(--danger-text); --m-bg: var(--danger-soft); }
  .stat .ic {
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--m-bg); color: var(--m-ink);
    display: grid; place-items: center; font-size: 15px; font-weight: 700;
    position: relative; z-index: 1;
  }
  .stat .wm {
    position: absolute; right: -8px; bottom: -14px; font-size: 76px; line-height: 1;
    color: var(--m-ink); opacity: .07; transform: rotate(-12deg); pointer-events: none; z-index: 0;
  }
  .stat .k { color: var(--ink-2); font-size: 12px; font-weight: 600; position: relative; z-index: 1; }
  .stat .v { font: 700 22px var(--font-display); line-height: 1.15; position: relative; z-index: 1; }
  .stat .v-sub { font: 700 15px var(--font-display); color: var(--ink-2); position: relative; z-index: 1; }
  .stat .v small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 3px; }
  .stat .h { font-size: 11px; color: var(--muted); line-height: 1.45; position: relative; z-index: 1; }
  button.stat { cursor: pointer; transition: border-color var(--motion-fast) ease, box-shadow var(--motion-fast) ease; }
  button.stat.is-selected { border-color: var(--m-ink); box-shadow: inset 0 0 0 1px var(--m-ink), var(--glass-shadow); }
  .stat .chk { position: absolute; top: 12px; right: 12px; font-size: 12px; font-weight: 700; color: var(--m-ink); background: rgba(255,255,255,.85); border-radius: 999px; padding: 1px 7px; z-index: 1; }

  /* 筛选与工具栏 */
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .chip {
    border: 1px solid var(--line); background: rgba(255,255,255,.85);
    border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer;
    color: var(--ink); white-space: nowrap;
    transition: background-color var(--motion-fast) ease, border-color var(--motion-fast) ease, color var(--motion-fast) ease;
  }
  .chip .n { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .chip.on { background: var(--gold-soft); border-color: var(--gold); color: var(--gold-text); font-weight: 600; }
  .chip.on .n { color: var(--gold-text); }
  .chip:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible {
    outline: 3px solid rgba(224,165,11,.35); outline-offset: 2px;
  }
  select, input[type=search], input[type=number], input[type=text], input[type=datetime-local], input[type=url] {
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
    font: 13px var(--font-body); background: rgba(255,255,255,.92); color: var(--ink);
  }
  input[type=search] { min-width: 190px; }
  .check-lbl { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; background: rgba(255,255,255,.8); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .seg button {
    border: 0; background: none; padding: 4px 10px; border-radius: 6px;
    font: 600 12px var(--font-body); color: var(--muted); cursor: pointer;
    transition: background-color var(--motion-fast) ease, color var(--motion-fast) ease;
  }
  .seg button.on { background: var(--gold-soft); color: var(--gold-text); }

  button.btn {
    border: 1px solid var(--line); background: rgba(255,255,255,.92);
    border-radius: 8px; padding: 6px 11px; font: 600 13px var(--font-body);
    cursor: pointer; color: var(--ink); display: inline-flex; align-items: center; gap: 5px;
    transition: transform var(--motion-press) var(--ease-out-strong), background-color var(--motion-fast) ease, border-color var(--motion-fast) ease;
  }
  button.btn:active { transform: scale(0.97); }
  button.btn.sm { padding: 4px 9px; font-size: 12px; }
  button.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
  button.btn.danger-ghost { color: var(--danger-text); border-color: var(--danger-border); background: var(--danger-soft); }

  /* 卡片网格 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    border-radius: 14px;
    border-top: 3px solid var(--neutral);
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    transition: box-shadow var(--motion-base) var(--ease-out-strong);
  }
  .card.s-healthy { border-top-color: var(--ok); }
  .card.s-warn { border-top-color: var(--warn); }
  .card.s-danger { border-top-color: var(--danger); }
  .card.s-disabled { opacity: .72; }
  .head { display: flex; gap: 11px; align-items: flex-start; }
  .logo { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #fff; font: 800 16px var(--font-display); flex: none; }
  .head-info { min-width: 0; flex: 1; }
  .head .name { font: 700 15px var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .head .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .badges { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
  .tag { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; border-radius: 6px; padding: 2px 8px; white-space: nowrap; border: 1px solid transparent; }
  .t-ok { background: var(--ok-soft); color: var(--ok-text); border-color: var(--ok-border); }
  .t-warn { background: var(--warn-soft); color: var(--warn-text); border-color: var(--warn-border); }
  .t-danger { background: var(--danger-soft); color: var(--danger-text); border-color: var(--danger-border); }
  .t-neutral { background: var(--neutral-soft); color: var(--neutral-text); border-color: var(--neutral-border); }
  .t-gold { background: var(--gold-soft); color: var(--gold-text); border-color: var(--gold-border); }
  .t-info { background: var(--info-soft); color: var(--info-text); border-color: var(--info-border); }

  .models { display: flex; flex-wrap: wrap; gap: 6px; }
  .models .m { font: 12px var(--font-mono); background: rgba(243,244,246,.95); border: 1px solid var(--line-soft); border-radius: 5px; padding: 2px 7px; color: #374151; }

  .block { border-top: 1px dashed var(--line); padding-top: 10px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .label { color: var(--muted); font-size: 12px; }
  .val { font: 700 16px var(--font-display); }
  .unset { color: #8c96a6; font-style: italic; font-weight: 400; font-size: 12px; }
  .bar-track { position: relative; height: 7px; background: #e8ebf2; border-radius: 999px; overflow: visible; margin: 7px 0 5px; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width var(--motion-base) var(--ease-out-strong); }
  .bar-mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); border-radius: 2px; opacity: .65; }
  .f-ok { background: var(--ok); } .f-warn { background: var(--warn); } .f-danger { background: var(--danger); }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .spend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .internal-box { background: rgba(246,247,249,.85); border: 1px solid var(--line-soft); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; align-items: center; padding-top: 4px; border-top: 1px solid var(--line-soft); }
  .links a { font-size: 12px; color: var(--gold-text); text-decoration: none; font-weight: 600; }
  .more-wrap { position: relative; }
  .more-menu {
    position: absolute; right: 0; bottom: calc(100% + 6px); min-width: 144px; z-index: 25;
    background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 4px;
    box-shadow: 0 12px 28px rgba(26,26,46,.14);
    transform-origin: bottom right;
    transition: opacity var(--motion-fast) var(--ease-out-strong), transform var(--motion-fast) var(--ease-out-strong);
  }
  .more-menu button {
    width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px;
    border-radius: 6px; font: 500 13px var(--font-body); color: var(--ink); cursor: pointer;
  }
  .more-menu button.danger { color: var(--danger-text); }

  /* 表格视图（复用旧提供商管理能力） */
  .table-wrap { background: var(--glass-bg); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); border-radius: 14px; overflow-x: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 860px; }
  table.data th { background: rgba(250,251,254,.85); color: var(--ink-2); font-weight: 600; text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.data td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  table.data tr:last-child td { border-bottom: 0; }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; background: var(--glass-bg); border: 1px dashed var(--line); border-radius: 14px; }

  /* 预设管理 */
  .trail-panel { background: var(--glass-bg); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
  .trail-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 9px; }
  .trail-row:last-child { margin-bottom: 0; }
  .trail-row .lbl { width: 52px; color: var(--muted); font-size: 12px; font-weight: 600; padding-top: 6px; flex: none; }
  .trail-row .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .presets { background: var(--glass-bg); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); border-radius: 14px; overflow: hidden; }
  .head-row { display: grid; grid-template-columns: minmax(260px, 1.5fr) 140px 175px 110px 80px; gap: 12px; padding: 9px 14px; font-size: 12px; font-weight: 600; color: var(--muted); background: rgba(250,251,254,.85); border-bottom: 1px solid var(--line); }
  .group-h { background: rgba(250,250,248,.92); padding: 9px 14px; font: 700 13px var(--font-display); color: var(--ink-2); border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  .group-h .nav-cat { font-size: 11px; font-weight: 500; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; }
  .group-h .c { margin-left: auto; font-weight: 500; color: var(--muted); font-size: 12px; }
  .prow {
    display: grid; grid-template-columns: minmax(260px, 1.5fr) 140px 175px 110px 80px;
    gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line-soft); align-items: center; cursor: pointer;
    transition: background-color var(--motion-fast) ease;
  }
  .prow:last-child { border-bottom: 0; }
  .prow .crumbs { font-size: 13px; min-width: 0; }
  .prow .crumbs .f { color: var(--muted); }
  .prow .crumbs .sepc { color: #b6becb; margin: 0 5px; }
  .prow .pn { font: 600 13px var(--font-mono); color: var(--ink); word-break: break-all; }
  .prow .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .prow .model-pill { font: 12px var(--font-mono); background: rgba(243,244,246,.95); border: 1px solid var(--line-soft); border-radius: 5px; padding: 2px 7px; color: #374151; display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .unassigned { color: var(--danger-text); }
  .alert { background: var(--danger-soft); color: var(--danger-text); border: 1px solid var(--danger-border); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .alert button { margin-left: auto; }

  /* 弹窗与抽屉 */
  .mask {
    position: fixed; inset: 0; background: rgba(20, 22, 30, .42); z-index: 50;
    display: grid; place-items: center; padding: 12px;
    transition: opacity var(--motion-base) var(--ease-out-strong);
  }
  .mask.drawer-mask { display: flex; justify-content: flex-end; align-items: stretch; padding: 0; }
  .dlg {
    background: #fff; border-radius: 16px; width: min(460px, calc(100% - 24px)); max-height: calc(100% - 32px);
    overflow-y: auto; padding: 20px; box-shadow: 0 24px 60px rgba(0,0,0,.22);
    transform: scale(1); opacity: 1;
    transition: transform var(--motion-base) var(--ease-out-strong), opacity var(--motion-base) var(--ease-out-strong);
  }
  @starting-style { .dlg { transform: scale(0.96); opacity: 0; } }
  .drawer {
    background: #fff; width: min(560px, calc(100% - 24px)); height: 100%;
    display: flex; flex-direction: column; box-shadow: -12px 0 40px rgba(0,0,0,.18);
    transform: translateX(0); opacity: 1;
    transition: transform var(--motion-sheet) var(--ease-drawer), opacity var(--motion-fast) ease;
  }
  @starting-style { .drawer { transform: translateX(100%); opacity: .85; } }
  .drawer-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .drawer-head h3 { margin: 0; font: 700 16px var(--font-display); }
  .drawer-head .x { margin-left: auto; border: 0; background: none; font-size: 20px; color: var(--muted); cursor: pointer; padding: 2px 8px; border-radius: 6px; }
  .drawer-body { padding: 16px 20px 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 18px; }
  .drawer-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; background: #fafbfe; }
  .sec-title { font: 700 13px var(--font-display); color: var(--ink); margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
  .kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
  .field input, .field select { width: 100%; }
  .cp-list { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .cp-item { padding: 9px 12px; border-bottom: 1px solid var(--line-soft); font-size: 12px; display: flex; justify-content: space-between; gap: 10px; }
  .cp-item:last-child { border-bottom: 0; }
  .price-row { display: grid; grid-template-columns: 1.2fr 92px 88px 88px 66px; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 12px; }
  .price-row input, .price-row select { padding: 4px 6px; font-size: 12px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1F2430; color: #fff; padding: 10px 16px; border-radius: 10px;
    font-size: 13px; z-index: 70; box-shadow: 0 10px 28px rgba(0,0,0,.25);
    transition: opacity var(--motion-fast) var(--ease-out-strong), transform var(--motion-fast) var(--ease-out-strong);
  }
  @starting-style { .toast { opacity: 0; transform: translate(-50%, 8px); } }

  /* 仅精确指针启用悬停反馈（Emil + DESIGN.md） */
  @media (hover: hover) and (pointer: fine) {
    button.stat:hover { border-color: var(--m-ink); }
    button.btn:hover { border-color: var(--gold-border); background: var(--gold-soft); }
    button.btn.primary:hover { background: var(--gold-hover); border-color: var(--gold-hover); }

  if (!p.enabled) {
    return { status: 'disabled', renewFlag: null, balanceFlag: null, secondary: [] };

  const d = daysFrom(p.renew);
  let renewFlag = null;
  if (d !== null) {
    if (d < 0) renewFlag = 'renew_pending';
    else if (d <= 7) renewFlag = 'renew_soon';
  }
  let balanceFlag = null;
  if (p.balance !== null && !p.notBilled) {
    if (p.balance <= 0) balanceFlag = 'balance_empty';
    else if (p.threshold != null && p.balance < p.threshold) balanceFlag = 'balance_low';
  }
  let status = 'healthy';
  if (renewFlag === 'renew_pending') status = 'renew_pending';
  else if (balanceFlag === 'balance_empty') status = 'balance_empty';
  else if (balanceFlag === 'balance_low') status = 'balance_low';
  else if (renewFlag === 'renew_soon') status = 'renew_soon';

  const secondary = [];
  if (renewFlag && renewFlag !== status) secondary.push(renewFlag);
  if (balanceFlag && balanceFlag !== status) secondary.push(balanceFlag);
  return { status, renewFlag, balanceFlag, secondary };
}

function renewSection(p, ev) {
  if (!p.renew) return ''; // 正交：无续费/到期日则不占位
  const d = daysFrom(p.renew);
  const total = p.billing === 'yearly' ? 365 : p.billing === 'quarterly' ? 90 : 30;
  // v0.3：统一为“本周期已过进度”，彻底消除 1% → 100% 语义反转
  const elapsedPct = d < 0 ? 100 : Math.max(0, Math.min(100, Math.round(((total - d) / total) * 100)));
  const cls = ev.renewFlag ? 'f-warn' : 'f-ok';
  const txt = d < 0 ? `已过续费日 ${-d} 天 · 待确认` : `剩 ${d} 天（已过 ${elapsedPct}%）`;
  const cycle = p.billing === 'yearly' ? '年' : p.billing === 'quarterly' ? '季' : '月';
  return `<div class="block">
    <div class="row"><span class="label">下次续费 ${p.renew.slice(5)}</span><span class="num" style="font-weight:600;font-size:12px;color:${ev.renewFlag ? 'var(--warn-text)' : 'var(--ink)'}">${txt}</span></div>
    <div class="bar-track" aria-label="本周期已过 ${elapsedPct}%"><div class="bar-fill ${cls}" style="width:${elapsedPct}%"></div></div>
    <div class="hint">${esc(p.plan)}${p.price != null ? ` · ${fmtMoney(p.price, p.cur)} / ${cycle}` : ''}</div>
  </div>`;
}

function balanceSection(p, ev) {
  if (p.notBilled || p.balance == null) return ''; // 正交：未登记余额不强行占位
  const base = p.balanceBase && p.balanceBase > 0 ? p.balanceBase : Math.max(p.balance, 1);
  const remPct = Math.max(0, Math.min(100, Math.round((p.balance / base) * 100)));
  const threshPct = p.threshold != null ? Math.max(0, Math.min(100, Math.round((p.threshold / base) * 100))) : null;
  const cls = ev.balanceFlag === 'balance_empty' ? 'f-danger' : (ev.balanceFlag === 'balance_low' ? 'f-warn' : 'f-ok');
  const dDays = p.balanceAt ? Math.abs(daysFrom(p.balanceAt.slice(0, 10))) : null;
  const stale = dDays !== null && dDays > 14
    ? ` · <span class="tag t-warn">登记 ${dDays} 天前，建议核对</span>`
    : (p.balanceAt ? ` · 核对于 ${p.balanceAt.slice(5, 16).replace('T', ' ')}` : '');
  const inflight = p.inflight ? ` · 含 ${p.inflight} 次在途未计入` : '';
  return `<div class="block">
    <div class="row"><span class="label">余额（${p.deductByUsage ? '估算' : '固定不扣减'}）</span><span class="val num">${fmtMoney(p.balance, p.balanceCur)}</span></div>
    <div class="bar-track" aria-label="较上次登记剩余 ${remPct}%">
      <div class="bar-fill ${cls}" style="width:${remPct}%"></div>
      ${threshPct !== null ? `<span class="bar-mark" style="left:${threshPct}%" title="预警线 ${SYM[p.balanceCur]}${p.threshold}"></span>` : ''}
    </div>
    <div class="hint">较上次登记（${fmtMoney(base, p.balanceCur)}）剩 ${remPct}%${p.threshold != null ? ` · 预警 ${fmtMoney(p.threshold, p.balanceCur)}` : ''}${stale}${inflight}</div>
  </div>`;
}

function getFilteredProviders() {
  const q = document.getElementById('sub-q').value.trim().toLowerCase();
  const kind = document.getElementById('sub-kind').value;
  const proto = document.getElementById('sub-proto').value;
  const hideDis = document.getElementById('sub-hide-dis').checked;
  const sort = document.getElementById('sub-sort').value;
  const fn = SUB_FILTERS.find(([k]) => k === subFilter)[2];

  let list = PROVIDERS.filter((p) => fn(evalProvider(p)));
  if (kind) list = list.filter((p) => p.kind === kind);
  if (proto) list = list.filter((p) => p.proto === proto);
  if (hideDis) list = list.filter((p) => p.enabled);
  if (q) list = list.filter((p) => p.name.toLowerCase().includes(q) || p.models.some((m) => m.toLowerCase().includes(q)));

  const remRatio = (p) => (p.balance == null || !p.balanceBase) ? Infinity : p.balance / p.balanceBase;
  list.sort((a, b) => {
    if (sort === 'balance') return remRatio(a) - remRatio(b);
    if (sort === 'month') {
      // 同币种内部按金额降序（CNY 组在前、USD 组在后，避免不同币种数字直接混排）
      if (a.cur !== b.cur) return a.cur === 'CNY' ? -1 : 1;
      return b.month - a.month;
    }
    const da = daysFrom(a.renew), db = daysFrom(b.renew);
    return (da ?? 1e9) - (db ?? 1e9);
  });
  return list;
}

function renderCardsOrTable() {
  const list = getFilteredProviders();
  const grid = document.getElementById('sub-grid');
  const tbl = document.getElementById('sub-table');
  grid.classList.toggle('hidden', subView !== 'card' || list.length === 0);
  tbl.classList.toggle('hidden', subView !== 'table' || list.length === 0);
  document.getElementById('sub-empty').classList.toggle('hidden', list.length > 0);
  if (subView === 'card') grid.innerHTML = list.map(cardHtml).join('');
  else tbl.innerHTML = tableHtml(list);
}

function renderSub() {
  renderSummary();
  renderSubFilters();
  renderCardsOrTable();
}

function openBalanceModal(id) {
  const p = PROVIDERS.find((x) => x.id === id);
  const est = p.balance;
  document.getElementById('dialog-host').innerHTML = `<div class="mask" id="mask"><div class="dlg" role="dialog" aria-modal="true" aria-label="登记余额">
    <h3 style="margin:0 0 4px;font:700 17px var(--font-display)">登记余额 · ${esc(p.name)}</h3>
    <div class="hint" style="margin-bottom:14px">截点默认精确到当前时刻（北京时间），仅扣减该时刻之后结束的按量调用，避免重复扣减。</div>
    <div class="kv-grid">
      <div class="field"><label>登记类型</label><select id="bal-kind"><option value="reconcile">余额核对</option><option value="topup">充值入账</option></select></div>
      <div class="field"><label>币种</label><input value="${p.balanceCur}" disabled></div>
      <div class="field"><label>当前余额</label><input type="number" id="bal-v" step="0.01" value="${p.balance ?? ''}" placeholder="例如 318.20"></div>
      <div class="field"><label>生效截点（北京时间）</label><input type="datetime-local" id="bal-at" value="${NOW_STR}"></div>
    </div>
    <div class="field" style="margin-top:10px"><label>备注（可选）</label><input type="text" id="bal-rmk" placeholder="如：官网核对 / 充值单号"></div>
    <div class="hint" id="bal-diff" style="margin-top:10px;padding:8px 10px;background:var(--neutral-soft);border-radius:8px"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">
      <button type="button" class="btn" id="bal-cancel">取消</button>
      <button type="button" class="btn primary" id="bal-ok">保存流水</button>
    </div>
  </div></div>`;
  const close = () => { document.getElementById('dialog-host').innerHTML = ''; };
  const updateDiff = () => {
    const raw = document.getElementById('bal-v').value;
    const box = document.getElementById('bal-diff');
    if (raw === '' || est == null) { box.textContent = est == null ? '首次登记，将作为后续余额估算与进度条基准。' : '请输入金额。'; return; }
    const diff = Number(raw) - est;
    const sign = diff >= 0 ? '+' : '';
    box.innerHTML = `当前系统估算：<strong>${fmtMoney(est, p.balanceCur)}</strong> · 本次登记差额：<strong>${sign}${SYM[p.balanceCur]}${diff.toFixed(2)}</strong>（将记入流水便于漂移复盘）`;
  };
  updateDiff();
  document.getElementById('bal-v').addEventListener('input', updateDiff);
  document.getElementById('bal-cancel').onclick = close;
  document.getElementById('mask').onclick = (e) => { if (e.target.id === 'mask') close(); };
  document.getElementById('bal-ok').onclick = () => {
    const raw = document.getElementById('bal-v').value;
    const at = document.getElementById('bal-at').value || NOW_STR;
    const kind = document.getElementById('bal-kind').value;
    const rmk = document.getElementById('bal-rmk').value.trim();
    if (raw === '') return;
    const val = Number(raw);
    p.checkpoints.unshift({ at: at.replace('T', ' '), kind, amount: val, estBefore: p.balance, remark: rmk || (kind === 'topup' ? '手工充值登记' : '手工余额核对') });
    p.balance = val;
    p.balanceBase = val;
    p.balanceAt = at;
    close();
    renderSub();
    toast(`${p.name} 已登记余额 ${SYM[p.balanceCur]}${val.toFixed(2)}（截点 ${at.replace('T', ' ')}）`);
  };
}

            <div class="field"><label>周期订阅金额</label><input type="number" id="ed-price" step="0.01" value="${p.price ?? ''}" placeholder="纯按量可留空"></div>
            <div class="field"><label>下次续费 / 到期日</label><input type="text" id="ed-renew" value="${esc(p.renew || '')}" placeholder="YYYY-MM-DD，可空"></div>
            <div class="field"><label>低余额预警线</label><input type="number" id="ed-thresh" step="0.01" value="${p.threshold ?? ''}"></div>
            <div class="field" style="display:flex;align-items:flex-end;padding-bottom:6px">
              <label class="check-lbl"><input type="checkbox" id="ed-deduct" ${p.deductByUsage ? 'checked' : ''}> 按调用估算自动扣减余额</label>
            </div>
            <div class="field"><label>控制台链接（仅 https）</label><input type="url" id="ed-console" value="${esc(p.console || '')}"></div>
            <div class="field"><label>API 文档链接（仅 https）</label><input type="url" id="ed-docs" value="${esc(p.docs || '')}"></div>
          </div>
        </div>
        <div>
          <h4 class="sec-title">3. 余额核对与充值流水（ark_ai_balance_checkpoints）</h4>
          <div class="cp-list">${cpRows}</div>
        </div>
        <div>
          <h4 class="sec-title">4. 统一模型单价表（ark_ai_model_prices · 仅影响后续新调用）</h4>
          <div class="hint" style="margin-bottom:8px">全平台唯一价格源，收编原 chat.pricing；支持百万 token（6 位小数）、按次及生图 rate_card。</div>
          ${priceRows}
        </div>
      </div>
      <div class="drawer-foot">
        <button type="button" class="btn" id="dr-cancel">取消</button>
        <button type="button" class="btn primary" id="dr-save">保存配置</button>
      </div>
    </aside>
  </div>`;
  const close = () => { document.getElementById('dialog-host').innerHTML = ''; };
  document.getElementById('dr-x').onclick = close;
  document.getElementById('dr-cancel').onclick = close;
  document.getElementById('mask').onclick = (e) => { if (e.target.id === 'mask') close(); };
  document.getElementById('dr-save').onclick = () => {
    const cUrl = document.getElementById('ed-console').value.trim();
    const dUrl = document.getElementById('ed-docs').value.trim();
    if ((cUrl && !cUrl.startsWith('https://')) || (dUrl && !dUrl.startsWith('https://'))) {
      toast('控制台与文档链接仅支持 https://');
      return;
    }
    p.name = document.getElementById('ed-name').value.trim() || p.name;
    p.kind = document.getElementById('ed-kind').value;
    p.plan = document.getElementById('ed-plan').value.trim();
    p.billing = document.getElementById('ed-billing').value;
    const pr = document.getElementById('ed-price').value;
    p.price = pr === '' ? null : Number(pr);
    p.renew = document.getElementById('ed-renew').value.trim() || null;
    const th = document.getElementById('ed-thresh').value;
    p.threshold = th === '' ? null : Number(th);
    p.deductByUsage = document.getElementById('ed-deduct').checked;
    p.console = cUrl || null;
    p.docs = dUrl || null;
    close();
    renderAll();
    toast(`已更新「${p.name}」的订阅与单价配置（原型演示）`);
  };
}

function handleSubAction(act, id) {
  const p = PROVIDERS.find((x) => x.id === id);
  if (!p) return;
  openMoreId = null;
  if (act === 'bal') { openBalanceModal(id); return; }
  if (act === 'edit') { openSubDrawer(id); return; }
  if (act === 'renew') {
    const next = addCycle(p.renew, p.billing);
    p.renew = next;
    p.renewConfirmedAt = NOW_STR;
    renderSub();
    toast(`${p.name} 已确认续费，下次续费日顺延至 ${next}`);
    return;
  }
  if (act === 'test') { toast(`连通性测试：${p.name} 响应正常（延迟 218ms）`); renderCardsOrTable(); return; }
  if (act === 'logs') { toast(`跳转「调用日志」Tab 并筛选提供商：${p.name}`); renderCardsOrTable(); return; }
  if (act === 'toggle') { p.enabled = !p.enabled; renderAll(); toast(`${p.name} 已${p.enabled ? '启用' : '停用'}（历史消费仍计入总账）`); return; }
  if (act === 'del') {
    const bound = PRESETS.filter((x) => x.provider === p.id && x.ok).map((x) => x.name);
    if (bound.length) toast(`无法删除：仍有 ${bound.length} 个启用预设引用（${bound.slice(0, 2).join(', ')}）`);
    else toast(`确认删除「${p.name}」后将软删，历史消费仍保留在总账`);
    renderCardsOrTable();
    return;
  }
  if (act === 'key') { if (showKeySet.has(id)) showKeySet.delete(id); else showKeySet.add(id); renderCardsOrTable(); }
}

document.getElementById('view-sub').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b) {
    if (openMoreId !== null && !e.target.closest('.more-wrap')) { openMoreId = null; renderCardsOrTable(); }
    return;
  }
  const act = b.dataset.act;
  const id = Number(b.dataset.id);
  if (act === 'more') { openMoreId = openMoreId === id ? null : id; renderCardsOrTable(); return; }
  handleSubAction(act, id);
});

['sub-q', 'sub-kind', 'sub-proto', 'sub-sort', 'sub-hide-dis'].forEach((id) => {
  document.getElementById(id).addEventListener(id === 'sub-q' ? 'input' : 'change', renderCardsOrTable);
});
document.getElementById('v-card').onclick = () => { subView = 'card'; document.getElementById('v-card').classList.add('on'); document.getElementById('v-table').classList.remove('on'); renderCardsOrTable(); };
document.getElementById('v-table').onclick = () => { subView = 'table'; document.getElementById('v-table').classList.add('on'); document.getElementById('v-card').classList.remove('on'); renderCardsOrTable(); };
document.getElementById('btn-add-sub').onclick = () => toast('打开「新增订阅源」抽屉（含连接配置 + 订阅与单价）');
document.getElementById('close-notice').onclick = () => document.getElementById('merge-notice').classList.add('hidden');

/* ---------- 预设管理（三层面包屑筛选 + 详情抽屉 + 窄屏保留模型） ---------- */
const sel = { feature: new Set(), provider: new Set(), model: new Set() };

function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  ['feature', 'provider', 'model'].forEach((k) => { sel[k] = new Set((q.get(k) || '').split(',').filter(Boolean)); });
  if (q.get('tab') === 'preset') showTab('preset', false);
}
function writeHash() {
  const q = new URLSearchParams();
  if (!document.getElementById('view-preset').classList.contains('hidden')) q.set('tab', 'preset');
  ['feature', 'provider', 'model'].forEach((k) => { if (sel[k].size) q.set(k, [...sel[k]].join(',')); });
  history.replaceState(null, '', q.toString() ? '#' + q.toString() : location.pathname);
}

const provName = (id) => PROVIDERS.find((p) => p.id === id)?.name || '—';
const featMeta = (key) => FEATURES.find((f) => f.key === key) || { key, nav: '待处理', route: null };

function matchesExcept(pr, skip) {
  if (skip !== 'feature' && sel.feature.size && !sel.feature.has(pr.feature)) return false;
  if (skip !== 'provider' && sel.provider.size && !sel.provider.has(String(pr.provider))) return false;
  if (skip !== 'model' && sel.model.size && !sel.model.has(pr.model)) return false;
  return true;
}

function chipGroup(key, items) {
  return items.map(({ value, label, count, dim }) =>
    `<button type="button" class="chip ${sel[key].has(String(value)) ? 'on' : ''}" data-k="${key}" data-v="${esc(value)}" ${dim ? 'style="opacity:.5"' : ''}>${esc(label)}<span class="n">${count}</span></button>`).join('');
}

function renderPresetFilters() {
  const fItems = FEATURES.map((f) => {
    const n = PRESETS.filter((p) => p.feature === f.key && matchesExcept(p, 'feature')).length;
    return { value: f.key, label: f.key, count: n, dim: n === 0 };
  }).filter((x) => x.count > 0 || sel.feature.has(x.value));
  document.getElementById('f-feature').innerHTML = chipGroup('feature', fItems);

  const pIds = [...new Set(PRESETS.map((p) => p.provider))];
  const pItems = pIds.map((id) => {
    const n = PRESETS.filter((p) => p.provider === id && matchesExcept(p, 'provider')).length;
    return { value: id, label: provName(id), count: n, dim: n === 0 };
  }).filter((x) => x.count > 0 || sel.provider.has(String(x.value)));
  document.getElementById('f-provider').innerHTML = chipGroup('provider', pItems);

  const mItems = [...new Set(PRESETS.filter((p) => matchesExcept(p, 'model')).map((p) => p.model))].map((m) => {
    const n = PRESETS.filter((p) => p.model === m && matchesExcept(p, 'model')).length;
    return { value: m, label: m, count: n };
  });
  document.getElementById('f-model').innerHTML = chipGroup('model', mItems);

  document.querySelectorAll('.trail-row .chip').forEach((b) => {
    b.onclick = () => {
      const k = b.dataset.k, v = b.dataset.v;
      if (sel[k].has(v)) sel[k].delete(v); else sel[k].add(v);
      if (k !== 'model') [...sel.model].forEach((m) => { if (!PRESETS.some((p) => p.model === m && matchesExcept(p, 'model'))) sel.model.delete(m); });
      writeHash(); renderPresets();
    };
  });
}

function openPresetDrawer(name) {
  const pr = PRESETS.find((x) => x.name === name);
  if (!pr) return;
  const prov = PROVIDERS.find((x) => x.id === pr.provider);
  const fm = featMeta(pr.feature);
  document.getElementById('dialog-host').innerHTML = `<div class="mask drawer-mask" id="mask">
    <aside class="drawer" role="dialog" aria-modal="true" aria-label="预设详情">
      <div class="drawer-head">
        <h3>${esc(pr.name)}</h3>
        <button type="button" class="x" id="pdr-x" aria-label="关闭">×</button>
      </div>
      <div class="drawer-body">
        <div class="hint">${esc(fm.nav)} › <strong>${esc(pr.feature)}</strong>${fm.route ? ` · <a href="javascript:void(0)" id="jump-route" style="color:var(--gold-text);font-weight:600">打开业务页 ${esc(fm.route)} ↗</a>` : ' · 平台内置（无独立菜单）'}</div>
        <div class="kv-grid">
          <div class="field"><label>绑定提供商</label><div><span class="tag t-gold">${esc(prov?.name || '—')}</span></div></div>
          <div class="field"><label>绑定模型</label><div class="mono" style="font-size:13px">${esc(pr.model)}</div></div>
          <div class="field"><label>调用模块（caller_module）</label><div class="mono" style="font-size:12px">${esc(pr.caller)}</div></div>
          <div class="field"><label>启用状态</label><div>${pr.ok ? '<span class="tag t-ok">启用</span>' : '<span class="tag t-neutral">停用</span>'}</div></div>
        </div>
        <div>
          <h4 class="sec-title">近 30 天用量与消费（二期完整统计）</h4>
          <div class="internal-box" style="grid-template-columns:repeat(2,1fr)">
            <div><div class="label">调用次数</div><div class="val num">${pr.calls} 次</div></div>
            <div><div class="label">成功率</div><div class="val num">${pr.rate != null ? pr.rate + '%' : '—'}</div></div>
            <div><div class="label">平均耗时</div><div class="val num">${pr.latency != null ? (pr.latency >= 1000 ? (pr.latency/1000).toFixed(1) + 's' : pr.latency + 'ms') : '—'}</div></div>
            <div><div class="label">本月估算消费</div><div class="val num">${esc(pr.spend)}</div></div>
          </div>
        </div>
        <div>
          <h4 class="sec-title">用途说明</h4>
          <div class="hint" style="color:var(--ink)">${esc(pr.desc)}</div>
        </div>
      </div>
      <div class="drawer-foot">
        <button type="button" class="btn" id="pdr-test">▶ 测试调用</button>
        <button type="button" class="btn" id="pdr-copy">❐ 复制预设</button>
        <button type="button" class="btn" id="pdr-toggle">${pr.ok ? '停用' : '启用'}</button>
        <button type="button" class="btn primary" id="pdr-edit">编辑预设</button>
      </div>
    </aside>
  </div>`;
  const close = () => { document.getElementById('dialog-host').innerHTML = ''; };
  document.getElementById('pdr-x').onclick = close;
  document.getElementById('mask').onclick = (e) => { if (e.target.id === 'mask') close(); };
  const jr = document.getElementById('jump-route');
  if (jr) jr.onclick = () => toast(`跳转到业务页面：${fm.route}`);
  document.getElementById('pdr-test').onclick = () => toast(`打开「${pr.name}」测试弹窗（保留多模态双图测试）`);
  document.getElementById('pdr-copy').onclick = () => toast(`已复制为 ${pr.name}_copy（自动继承归属功能：${pr.feature}）`);
  document.getElementById('pdr-toggle').onclick = () => { pr.ok = !pr.ok; close(); renderPresets(); toast(`${pr.name} 已${pr.ok ? '启用' : '停用'}`); };
  document.getElementById('pdr-edit').onclick = () => toast(`打开「${pr.name}」编辑表单（含 feature_key、AiPresetImageFields / ChatFields）`);
}

function renderPresets() {
  renderPresetFilters();
  document.getElementById('cnt-preset').textContent = String(PRESETS.length);
  const list = PRESETS.filter((p) => matchesExcept(p, null));
  const groups = {};
  list.forEach((p) => { (groups[p.feature] ||= []).push(p); });
  const order = FEATURES.map((f) => f.key).filter((k) => groups[k]);

  document.getElementById('preset-list').innerHTML = order.map((f) => {
    const fm = featMeta(f);
    const rows = groups[f].map((p) => {
      const pr = PROVIDERS.find((x) => x.id === p.provider);
      const unassigned = p.feature === '未归属';
      return `<div class="prow" tabindex="0" data-pname="${esc(p.name)}">
        <div class="crumbs"><span class="f ${unassigned ? 'unassigned' : ''}">${esc(p.feature)}</span><span class="sepc">›</span><span class="pn">${esc(p.name)}</span>
          <div class="d">${esc(p.desc)}${p.ok ? '' : ' · <span class="unassigned">已停用预设</span>'}</div></div>
        <div class="col-prov"><span class="tag ${pr && !pr.enabled ? 't-neutral' : 't-gold'}">${esc(pr?.name)}</span></div>
        <div class="col-model"><span class="model-pill">${esc(p.model)}</span></div>
        <div class="col-calls num">${p.calls} 次</div>
        <div class="col-status">${p.ok ? '<span class="tag t-ok">启用</span>' : '<span class="tag t-neutral">停用</span>'}</div>
      </div>`;
    }).join('');
    return `<div class="group-h">${f === '未归属' ? '<span class="unassigned">⚠ ' + f + '</span>' : esc(f)}<span class="nav-cat">${esc(fm.nav)}</span><span class="c">${groups[f].length} 个</span></div>${rows}`;
  }).join('');

  document.getElementById('preset-empty').classList.toggle('hidden', list.length > 0);
  document.getElementById('preset-count').textContent = `显示 ${list.length} / ${PRESETS.length} 个预设`;

  const unassignedN = PRESETS.filter((p) => p.feature === '未归属').length;
  document.getElementById('preset-alert').innerHTML = unassignedN
    ? `<div class="alert">⚠ ${unassignedN} 个存量预设未归属功能（调用不受影响，但无法按功能归类筛选）<button type="button" class="btn sm" id="go-unassigned">只看未归属</button></div>` : '';
  const go = document.getElementById('go-unassigned');
  if (go) go.onclick = () => { sel.feature = new Set(['未归属']); writeHash(); renderPresets(); };
}

document.getElementById('preset-list').addEventListener('click', (e) => {
  const row = e.target.closest('.prow[data-pname]');
  if (row) openPresetDrawer(row.dataset.pname);
});
document.getElementById('preset-list').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    const row = e.target.closest('.prow[data-pname]');
    if (row) { e.preventDefault(); openPresetDrawer(row.dataset.pname); }
  }
});
document.getElementById('clear-all').onclick = () => { Object.values(sel).forEach((s) => s.clear()); writeHash(); renderPresets(); };
document.getElementById('btn-add-preset').onclick = () => toast('打开「新增预设」表单（所属功能 feature_key 必填）');

/* ---------- Tab 切换与全局工具 ---------- */
function toast(msg) {
  document.querySelectorAll('.toast').forEach((n) => n.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function showTab(t, syncHash = true) {
  document.querySelectorAll('nav.tabs button').forEach((b) => {
    const active = b.dataset.tab === t;
    b.classList.toggle('on', active);
    b.setAttribute('aria-selected', String(active));
  });
  document.getElementById('view-sub').classList.toggle('hidden', t !== 'sub');
  document.getElementById('view-preset').classList.toggle('hidden', t !== 'preset');
  if (syncHash) writeHash();
}
document.querySelectorAll('nav.tabs button:not(.dis)').forEach((b) => { b.onclick = () => showTab(b.dataset.tab); });
document.querySelectorAll('nav.tabs button.dis').forEach((b) => { b.onclick = () => toast('原型聚焦「订阅管理」与「预设管理」，该 Tab 详见设计文档 §2'); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { document.getElementById('dialog-host').innerHTML = ''; openMoreId = null; renderCardsOrTable(); } });

function renderAll() { renderSub(); renderPresets(); }
readHash();
renderAll();
</script>
</body>
</html>
