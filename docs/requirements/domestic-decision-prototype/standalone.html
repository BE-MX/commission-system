  function orderEvidence(customer=null,attribute=null){
    let orders=getOrders();if(customer!==null)orders=D.orders.filter(o=>o.customer===customer&&o.day<state.days&&inScope(D.customers[o.customer]));
    if(attribute)orders=orders.filter(o=>o.lines.some(p=>matchLine(p)&&p[attribute.field]===attribute.value));
    const amount=sum(orders,'amount'),qty=sum(orders,'qty');
    const matches=p=>(customer!==null||matchLine(p))&&(!attribute||p[attribute.field]===attribute.value);
    const matched=orders.flatMap(o=>o.lines.filter(matches));
    const matchedQty=sum(matched,'qty'),matchedAmount=sum(matched,'amount');
    showDialog('订单证据与明细',`<div class="notice">${icon('info')}<span>下方为相关整单金额，订单 ID 去重。${attribute?`当前属性：${esc(attribute.value)}。`:''}匹配明细 ${num(matchedQty)} 件 / ${money(matchedAmount)}；相关整单共 ${orders.length} 单 / ${num(qty)} 件 / ${money(amount)}。命中明细以“●”标识。</span></div><div class="table-wrap"><table><thead><tr><th>订单 / 客户</th><th>下单日</th><th>整单件数</th><th class="amount">整单金额</th><th>状态</th></tr></thead><tbody>${orders.slice().reverse().slice(0,60).map(o=>`<tr><td><strong>DO${String(o.id).padStart(6,'0')}</strong><div class="customer-meta">${esc(D.customers[o.customer].name)}</div><div class="customer-meta">${o.lines.map(p=>`${matches(p)?'●':'○'} ${p.craft} ${p.length} ${p.color} ×${p.qty} / ${money(p.amount)}`).join('<br>')}</div></td><td>${o.date.slice(5)}</td><td>${o.qty}</td><td class="amount">${money(o.amount)}</td><td>${pill(o.status,o.status==='已发货'?'green':'gold')}</td></tr>`).join('')}</tbody></table></div>${orders.length>60?'<p class="fine" style="margin-top:14px">预览最近60笔，全部匹配数据可通过页面导出获取。</p>':''}${orders.length?'':empty('没有匹配订单')}`,{subtitle:'按当前状态重算 · 不含草稿和生产单',footer:`<span class="fine">人民币元 · 订单与明细不重复汇总</span>${btn('返回分析','close')}`});
  }
  function ledgerEvidence(){
    const rows=getLedger().filter(l=>l.type!=='期初余额').sort((a,b)=>a.day-b.day||b.id-a.id);
    showDialog('客户资金账本',`<div class="notice">${icon('shield')}<span>每条流水均保留变动前后余额。充值是平台入账口径，不推断银行到账日期。</span></div><div class="table-wrap"><table><thead><tr><th>客户 / 日期</th><th>类型</th><th class="amount">变动额</th><th class="amount">变动前</th><th class="amount">变动后</th></tr></thead><tbody>${rows.slice(0,70).map(l=>`<tr><td>${esc(D.customers[l.customer].name)}<div class="customer-meta">${l.date} · L${l.id}</div></td><td>${pill(l.type,l.amount>0?'green':'')}</td><td class="amount">${l.amount>0?'+':''}${money(l.amount)}</td><td class="amount">${money(l.before)}</td><td class="amount">${money(l.after)}</td></tr>`).join('')}</tbody></table></div><p class="fine" style="margin-top:15px">共 ${rows.length} 笔，预览最近70笔；完整账本支持导出。</p>`,{subtitle:'资金范围仅应用业务员与城市条件',footer:`<span class="fine">来源：本地模拟账本</span>${btn(icon('download')+' 导出全部流水','export-ledger','primary')}`});
  }
  function moreFilters(){
    showDialog('筛选你想了解的需求',`<form id="filter-form" class="form-grid">${[['craft','工艺'],['length','发长'],['color','头发颜色'],['size','尺码 / 尺寸'],['density','发量'],['series','发型系列'],['net','网帽颜色'],['city','经营城市']].map(([key,label])=>{const values=key==='city'?uniq(D.customers.map(c=>c.city)):uniq(D.products.map(p=>p[key]));return `<label class="field">${label}<select name="${key}"><option value="">全部</option>${values.map(v=>`<option value="${esc(v)}" ${state[key]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`;}).join('')}<p class="fine field full">不同属性同时满足于同一条明细。资金页仅应用业务员与城市范围。</p></form>`,{drawer:false,subtitle:'支持产品属性组合与地域交叉筛选',footer:`${btn('取消','close')}<button class="btn primary" type="submit" form="filter-form">应用筛选</button>`});
  }
  function taskForm(customer=null,claim=false){
    const clients=scopeCustomers();if(!clients.length)return toast('当前范围没有可跟进客户');const selected=customer??clients[0].id;
    const suggestion=claim?suggestions().find(s=>s.customer===selected):null;
    showDialog(claim?'认领客户跟进':'创建客户跟进',`<form id="task-form" data-source="${suggestion?.id||''}" class="form-grid"><label class="field full">跟进客户<select name="customer" required ${claim?'aria-readonly="true"':''}>${(claim?clients.filter(c=>c.id===selected):clients).map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)} · ${c.owner}</option>`).join('')}</select></label><label class="field full">跟进主题<input name="title" required maxlength="80" value="${esc(suggestion?.title||'了解下一阶段采购与常购规格需求')}"></label><label class="field">计划日期<input type="date" name="due" value="2026-10-12" required></label><label class="field">方式<select name="channel"><option>微信沟通</option><option>电话回访</option><option>线下拜访</option><option>内部核对</option></select></label><label class="field full">需要了解什么<textarea name="detail" maxlength="800" placeholder="记录待确认的问题，例如库存、交期与下一次补货计划">${esc(suggestion?.detail||'核对常购工艺与发长，了解门店库存和近期采购计划。')}</textarea></label><p class="fine field full">保存为浏览器内演示任务；不会自动发送客户消息。</p></form>`,{drawer:false,footer:`${btn('取消','close')}<button class="btn primary" type="submit" form="task-form">保存跟进</button>`});
  }
  function finishForm(id){const task=tasks.find(t=>t.id===id);if(!task)return;showDialog('登记这次跟进的结果',`<form id="finish-form" data-id="${esc(id)}" class="form-grid"><label class="field full">跟进结果<select name="result" required><option value="">请选择实际结果</option><option>已联系，需求待确认</option><option>客户计划补货</option><option>客户计划补款</option><option>暂时没有采购需求</option><option>内部账务已核对</option><option>数据或建议不准确</option></select></label><label class="field full">补充记录<textarea name="note" maxlength="600" placeholder="记录实际发生的沟通，不把意向当成成交"></textarea></label></form>`,{drawer:false,subtitle:task.title,footer:`${btn('取消','close')}<button class="btn primary" form="finish-form" type="submit">完成并记录</button>`});}
  function showBrief(){
    const n=summarize(),p=summarize(state.days),top=group(getLines(),'craft','qty')[0],risk=scopeCustomers().filter(c=>c.lastDay>30);
    showDialog('本期经营简报',`<div class="prototype-badge">${icon('spark')} AI呈现演示 · 本地规则生成，未调用模型</div><div class="brief-lead">${n.count?`近${state.days}天，${n.customers}家客户贡献 ${money(n.amount)} 订单。${top?`${esc(top.label)}是主要需求工艺。`:''}`:'当前条件下没有匹配订单，请调整筛选后重新生成。'}</div><p class="fine">范围：${state.owner==='all'?'全部演示业务员':state.owner} · ${D.iso(state.days-1)}—2026-10-08 · 当前状态重算</p><div class="brief-block"><h3>${pill('事实','green')} 订单与产品</h3><p>有效订单 ${n.count} 笔，相关整单金额 ${money(n.amount)}，匹配明细 ${n.qty} 件。${state.days<=90?`上一等长周期订单金额 ${money(p.amount)}。`:`上一等长周期无历史覆盖，不判断环比或新增。`}${top?`${esc(top.label)}工艺 ${top.value} 件，占匹配件数 ${pct(top.value,n.qty)}。`:''}</p>${textbtn('查看订单证据','orders')}</div><div class="brief-block"><h3>${pill('待核实推断','gold')} 客户经营信号</h3><p>当前客户范围有 ${risk.length} 家门店超过30天没有下单。可能与集中备货、库存消耗或经营计划有关，当前证据不能判断具体原因。</p></div><div class="brief-block"><h3>${pill('建议行动','blue')} 下一步做什么</h3><ol><li>优先回访购买节奏延后的门店，核对库存与采购计划。</li><li>结合常购工艺、发长和颜色提出产品话题，先问需求再做推荐。</li><li>充值与订单分开核对；欠款不直接等同于逾期。</li></ol></div><div class="notice warm" style="margin-top:22px">${icon('info')}<span>本简报为高保真原型演示。未接入成本、库存、外部市场或真实AI，不能用于实际经营决策。</span></div>`,{subtitle:'让数字有解释，让建议有证据',footer:`${btn('查看行动','page','', 'data-page="actions"')}${btn(icon('download')+' 导出简报','export-brief','primary')}`});
  }
  function definitions(){showDialog('统一口径，才能正确比较',`<dl class="definition"><dt>有效订单金额</dt><dd>业务订单、未删除且处于生产中/已完工/已发货。金额用订单主表求和；产品维度用匹配明细金额，不重复累加整单。</dd><dt>产品筛选与整单</dt><dd>一张订单可能包含多种产品。“匹配产品金额”仅计命中明细；“相关整单金额”计该整张订单。件数按明细数量求和。</dd><dt>客户资金</dt><dd>充值只统计充值流水。余额是截止日存量，订单是期间需求。预存余额和信用欠款分开展示，不把充值加到订单额里。</dd><dt>画像与归属</dt><dd>原型展示当前负责人名下的客户组合。客户完整购买历史用于周期观察，不因产品筛选而把整体客户判成流失。</dd><dt>历史与趋势</dt><dd>演示日期固定为2026年10月8日，历史记录按当前状态重算。没有完整历史事件时不提供历史负责人或会员倒推。</dd><dt>AI与规则</dt><dd>所有简报在本地生成。真实系统需经过权限过滤、证据校验后调用统一AI服务；当前页面没有联网模型调用。</dd></dl>`,{subtitle:'功能设计中的关键边界，保留在原型中',footer:btn('了解了','close','primary')});}
  function quality(){
    showDialog('数据质量与覆盖',`<div class="notice warm">${icon('info')}<span>这是原型演示数据的校验结果，不是生产数据库质量报告。</span></div><div class="quality-grid"><div class="quality-item">订单 ${D.orders.length} 笔<strong>金额一致</strong></div><div class="quality-item">客户 ${D.customers.length} 家<strong>身份完整</strong></div><div class="quality-item">账本 ${D.ledger.length} 条<strong>余额连续</strong></div><div class="quality-item">适用产品属性<strong>演示全覆盖</strong></div></div><dl class="definition"><dt>可以核对的内容</dt><dd>每个客户的期初余额 + 期间流水 = 当前余额；订单金额等于明细价格 × 件数合计。筛选、图表和导出共用同一组数据。</dd><dt>尚未覆盖的业务能力</dt><dd>真实角色权限、后台审批、银行凭证、历史归属事件、模型预测与外部市场信息均未连接。原型不能替代真实系统。</dd><dt>最近演示快照</dt><dd>2026/10/08 09:30（北京时间）。日期固定便于设计评审；跟进任务仅保存在当前浏览器。</dd></dl>`,{drawer:false,footer:`${textbtn('查看指标定义','definitions')}${btn('关闭','close')}`});
  }
  function person(name){const clients=scopeCustomers().filter(c=>c.owner===name),orders=getOrders().filter(o=>D.customers[o.customer].owner===name);showDialog(`${esc(name)} · 经营画像`,`<div class="profile-hero">${avatar(name.slice(1))}<div><h3>${esc(name)}</h3><p>当前客户组合 · ${clients.length} 家门店</p><div class="profile-tags">${pill('事实画像','blue')}${pill('样本有限，不排名','gold')}</div></div></div><div class="mini-stats"><div class="mini-stat"><small>本期订单额</small><strong>${compact(sum(orders,'amount'))}</strong></div><div class="mini-stat"><small>下单件数</small><strong>${sum(orders,'qty')}</strong></div><div class="mini-stat"><small>活跃客户</small><strong>${uniq(orders.map(o=>o.customer)).length}</strong></div></div><div class="notice warm">${icon('info')}<span>当前负责人承接的客户资源与历史基础不同。此处反映客户组合，不等于业务员个人能力或历史绩效。</span></div><div class="dialog-section"><h3>客户贡献结构</h3>${bars(clients.map(c=>({label:c.name.split(' · ')[0],value:sum(orders.filter(o=>o.customer===c.id),'amount')})).sort((a,b)=>b.value-a.value),{currency:true})}</div><div class="dialog-section"><h3>可展开沟通的客户</h3>${customerTable(clients)}</div>`,{subtitle:'经营变化 → 客户结构 → 具体行动',footer:`<span class="fine">历史归因未启用</span>${btn('只看该业务员','set-owner','primary',`data-value="${name}"`)}`});}
  function saveView(){showDialog('保存当前分析视图',`<form id="view-form"><label class="field">视图名称<input name="name" maxlength="40" required value="${tabs.find(t=>t[0]===state.page)[1]} · 近${state.days}天"></label><p class="fine" style="margin-top:15px">保存当前专题、周期、业务员和产品筛选。只在当前浏览器可见。</p></form>`,{drawer:false,footer:`${btn('取消','close')}<button class="btn primary" form="view-form" type="submit">保存视图</button>`});}
  function views(){showDialog('我的分析视图',saved.length?saved.map((v,i)=>`<div class="view-card"><div><strong>${esc(v.name)}</strong><small>${tabs.find(t=>t[0]===v.state.page)?.[1]||'分析'} · 近${v.state.days}天 · ${esc(v.state.owner==='all'?'全部业务员':v.state.owner)}</small></div>${btn('打开','load-view','sm',`data-id="${i}"`)}</div>`).join(''):'<div class="empty">还没有保存视图。在任意专题筛选后点击“保存视图”。</div>',{drawer:false,footer:btn('关闭','close')});}
  function download(filename,content,type='text/csv;charset=utf-8'){
    const blob=new Blob(['\uFEFF',content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出演示数据文件');
  }
  const csv=rows=>rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  function exportData(ledger=false){
    const rows=ledger?[['演示数据：非真实财务资料'],['资金日期','客户','类型','金额','变动前余额','变动后余额'],...getLedger().map(l=>[l.date,D.customers[l.customer].name,l.type,l.amount,l.before,l.after])]:[['演示数据：产品明细按当前筛选，整单金额不在行间重复'],['订单','日期','客户','工艺','发长','颜色','尺码','系列','件数','单价','明细金额'],...getLines().map(p=>['DO'+String(p.order).padStart(6,'0'),p.date,D.customers[p.customer].name,p.craft,p.length,p.color,p.size,p.series,p.qty,p.price,p.amount])];
    download(`内贸${ledger?'资金账本':'产品分析'}-演示数据-20261008.csv`,csv(rows));
  }
  function reset(){Object.assign(state,{days:90,owner:'all',type:'all',craft:'',length:'',color:'',city:'',size:'',density:'',series:'',net:'',query:'',customerPage:1});render();}
  function navigate(page){if(!tabs.some(t=>t[0]===page))return;state.page=page;state.menu=false;if($('#detail').open)closeDialog();render();window.scrollTo({top:0,behavior:'instant'});}
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.value,id=b.dataset.id;
    if(a==='page')return navigate(b.dataset.page);
    if(a==='close')return closeDialog();if(a==='customer')return profile(Number(id));
    if(a==='menu'){state.menu=!state.menu;return render();}
    if(a==='reset')return reset();if(a==='filters')return moreFilters();if(a==='quality')return quality();if(a==='definitions'||a==='about')return definitions();
    if(a==='orders')return orderEvidence();if(a==='customer-orders')return orderEvidence(Number(id));if(a==='ledger')return ledgerEvidence();
    if(a==='metric'){state.metric=v;return render();}if(a==='dimension'){state.dimension=v;return render();}
    if(a==='dimension-filter'){state[b.dataset.field]=v;state.page='products';return render();}
    if(a==='attribute')return orderEvidence(null,{field:b.dataset.field,value:v});
    if(a==='heat'){state.type='cap';state.craft=b.dataset.craft;state.length=b.dataset.length;render();return orderEvidence();}
    if(a==='type'){state.type=v;return render();}if(a==='remove-filter'){state[b.dataset.field]='';return render();}
    if(a==='risk'){state.page='customers';render();const c=scopeCustomers().sort((a,b)=>b.lastDay-a.lastDay)[0];return c?profile(c.id):toast('当前范围没有客户');}
    if(a==='customer-page'){state.customerPage=Number(v);return render();}
    if(a==='person')return person(v);if(a==='set-owner'){state.owner=v;closeDialog();return navigate('overview');}
    if(a==='brief')return showBrief();if(a==='save-view')return saveView();if(a==='views')return views();
    if(a==='load-view'){Object.assign(state,saved[Number(id)].state);closeDialog();render();return toast('已恢复保存的筛选和专题');}
    if(a==='new-task')return taskForm(id===undefined?null:Number(id));if(a==='claim')return taskForm(Number(id),true);if(a==='finish')return finishForm(id);
    if(a==='action-status'){state.actionStatus=v;return render();}
    if(a==='export')return exportData(state.page==='finance');if(a==='export-ledger')return exportData(true);
    if(a==='export-brief')return download('内贸经营简报-演示-20261008.txt',$('#detail .dialog-body').innerText,'text/plain;charset=utf-8');
    if(a==='reset-tasks')return showDialog('重置演示跟进',`<p class="small">将清除当前浏览器中的 ${tasks.length} 条演示跟进记录，恢复初始建议。生产数据不受影响。</p>`,{drawer:false,footer:`${btn('保留记录','close')}${btn('清除演示记录','confirm-reset','primary')}`});
    if(a==='confirm-reset'){tasks=[];persist('tasks',tasks);closeDialog();render();toast('演示跟进已重置');}
  });
  document.addEventListener('change',e=>{
    const id=e.target.id;if(id==='period')state.days=Number(e.target.value);else if(id==='owner')state.owner=e.target.value;else if(id==='product-type')state.type=e.target.value;else return;
    state.customerPage=1;render();document.getElementById(id)?.focus();
  });
  document.addEventListener('input',e=>{if(e.target.id==='customer-search'){state.query=e.target.value;state.customerPage=1;const pos=e.target.selectionStart;$('#page-content').innerHTML=customers();const input=$('#customer-search');input.focus();input.setSelectionRange(pos,pos);}});
  document.addEventListener('submit',e=>{
    e.preventDefault();const form=e.target,data=new FormData(form);
    if(form.id==='filter-form'){for(const [key,value] of data)state[key]=String(value);state.customerPage=1;closeDialog();render();return toast('筛选已应用到订单与产品分析');}
    if(form.id==='view-form'){saved.push({name:String(data.get('name')).trim(),state:{...state,menu:false}});persist('views',saved);closeDialog();return toast('视图已保存，可从左侧“我的分析视图”打开');}
    if(form.id==='task-form'){
      if(form.dataset.source&&tasks.some(t=>t.source===form.dataset.source)){closeDialog();return toast('这条建议已认领');}
      const customer=Number(data.get('customer'));tasks.push({id:'task-'+Date.now(),source:form.dataset.source,customer,owner:D.customers[customer].owner,title:String(data.get('title')).trim(),detail:String(data.get('detail')).trim(),due:String(data.get('due')),channel:String(data.get('channel')),status:'进行中'});
      persist('tasks',tasks);closeDialog();state.page='actions';state.actionStatus='进行中';render();return toast('跟进已保存，仅记录在当前浏览器');
    }
    if(form.id==='finish-form'){const task=tasks.find(t=>t.id===form.dataset.id);if(task){task.status='已完成';task.result=String(data.get('result'))+(data.get('note')?' · '+String(data.get('note')):'');persist('tasks',tasks);}closeDialog();state.actionStatus='已完成';render();toast('已登记跟进结果');}
  });
  $('#detail').addEventListener('click',e=>{if(e.target===$('#detail')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
  $('#detail').addEventListener('cancel',e=>{e.preventDefault();closeDialog();});
  window.Prototype={state,summarize,getOrders,getLines,getLedger,reset};
  render();
})();

</script>
</body>
</html>
